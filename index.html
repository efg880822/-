<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5efe7"><title>我們的台灣旅遊地圖</title>
<style>
:root{--bg:#f7f3ee;--card:#fffdf9;--ink:#2e2a27;--muted:#827a73;--accent:#b86b4b;--line:#e9dfd5;--shadow:0 10px 30px rgba(67,48,37,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 20px 18px;text-align:center;background:linear-gradient(135deg,#f7eee6,#efe6dd)}
h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:.04em}header p{margin:8px 0 0;color:var(--muted)}
.wrap{max-width:1200px;margin:auto;padding:18px}.map-card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
.map-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.map-title h2{margin:0;font-size:20px}.map-title small{color:var(--muted)}
.city-map{position:relative;min-height:390px;border-radius:24px;padding:18px;background:radial-gradient(circle at 78% 18%,rgba(214,180,151,.18),transparent 28%),linear-gradient(145deg,#fbf7f2,#f2e9e0);border:1px solid #eadfd5;overflow:hidden}.city-map:before{content:"TAIWAN TRAVEL";position:absolute;right:18px;top:14px;font-size:10px;letter-spacing:3px;color:#b7a294;font-weight:800}.map-water{position:absolute;inset:0;background-image:radial-gradient(rgba(184,159,141,.13) 1px,transparent 1px);background-size:18px 18px;pointer-events:none}.city-grid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(5,62px);gap:7px;max-width:820px;margin:18px auto 0;z-index:1}.city-btn{border:1px solid rgba(160,130,110,.28);background:rgba(255,255,255,.86);backdrop-filter:blur(4px);border-radius:16px;padding:8px 5px;color:var(--ink);cursor:pointer;min-height:54px;transition:.2s;box-shadow:0 5px 14px rgba(104,79,61,.06)}
.city-btn:hover,.city-btn.active{transform:translateY(-3px) scale(1.02);background:#ead8cb;border-color:#cda996;box-shadow:0 9px 18px rgba(104,79,61,.12)}.city-btn span{display:block;font-size:14px;font-weight:700}.city-btn b{font-size:11px;color:var(--accent);margin-top:3px;display:block}.city-btn[data-city="全部"]{grid-column:4;grid-row:1;background:#6f8f7b;color:white;border-color:#6f8f7b}.city-btn[data-city="全部"] b{color:white}.city-btn[data-city="基隆市"]{grid-column:6;grid-row:1}.city-btn[data-city="台北市"]{grid-column:6;grid-row:2}.city-btn[data-city="新北市"]{grid-column:5;grid-row:2}.city-btn[data-city="桃園市"]{grid-column:4;grid-row:2}.city-btn[data-city="新竹市"]{grid-column:4;grid-row:3}.city-btn[data-city="新竹縣"]{grid-column:5;grid-row:3}.city-btn[data-city="苗栗縣"]{grid-column:5;grid-row:4}.city-btn[data-city="台中市"]{grid-column:4;grid-row:4}.city-btn[data-city="彰化縣"]{grid-column:3;grid-row:4}.city-btn[data-city="南投縣"]{grid-column:4;grid-row:5}.city-btn[data-city="雲林縣"]{grid-column:3;grid-row:5}.city-btn[data-city="嘉義市"]{grid-column:2;grid-row:5}.city-btn[data-city="嘉義縣"]{grid-column:1;grid-row:5}.city-btn[data-city="台南市"]{grid-column:2;grid-row:4}.city-btn[data-city="高雄市"]{grid-column:2;grid-row:3}.city-btn[data-city="屏東縣"]{grid-column:2;grid-row:2}.city-btn[data-city="宜蘭縣"]{grid-column:7;grid-row:2}.city-btn[data-city="花蓮縣"]{grid-column:7;grid-row:3}.city-btn[data-city="台東縣"]{grid-column:7;grid-row:4}.city-btn[data-city="澎湖縣"]{grid-column:1;grid-row:3}.city-btn[data-city="金門縣"]{grid-column:1;grid-row:1}.city-btn[data-city="連江縣"]{grid-column:2;grid-row:1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.search{flex:1;min-width:220px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:white;font-size:16px;outline:none}
.filter{border:1px solid var(--line);background:white;border-radius:14px;padding:0 14px;font-size:15px}.stats{color:var(--muted);font-size:14px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.thumb{aspect-ratio:1.35;position:relative;background:linear-gradient(135deg,#e8ddd3,#f5eee8);overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{height:100%;display:flex;align-items:center;justify-content:center;font-size:42px;color:#a98e7d}.badge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.9);padding:6px 9px;border-radius:999px;font-size:12px}
.body{padding:15px}.name{font-weight:800;font-size:18px;margin-bottom:7px;line-height:1.35}.meta{color:var(--muted);font-size:13px;margin-bottom:9px}
.caption{font-size:14px;line-height:1.65;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;gap:8px;margin-top:12px}.actions a{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:12px;background:#f0e4da;color:#674a3b;font-weight:700;font-size:13px}.empty{padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
@media(max-width:900px){.city-map{min-height:390px}.city-grid{grid-template-columns:repeat(7,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:12px}.city-map{min-height:470px;padding:12px}.city-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,58px);gap:6px}.city-btn[data-city="全部"]{grid-column:2;grid-row:1}.city-btn[data-city="基隆市"]{grid-column:4;grid-row:2}.city-btn[data-city="台北市"]{grid-column:4;grid-row:3}.city-btn[data-city="新北市"]{grid-column:3;grid-row:3}.city-btn[data-city="桃園市"]{grid-column:2;grid-row:3}.city-btn[data-city="新竹市"]{grid-column:2;grid-row:4}.city-btn[data-city="新竹縣"]{grid-column:3;grid-row:4}.city-btn[data-city="苗栗縣"]{grid-column:3;grid-row:5}.city-btn[data-city="台中市"]{grid-column:2;grid-row:5}.city-btn[data-city="彰化縣"]{grid-column:1;grid-row:5}.city-btn[data-city="南投縣"]{grid-column:2;grid-row:6}.city-btn[data-city="雲林縣"]{grid-column:1;grid-row:6}.city-btn[data-city="嘉義市"]{grid-column:1;grid-row:7}.city-btn[data-city="嘉義縣"]{grid-column:2;grid-row:7}.city-btn[data-city="台南市"]{grid-column:3;grid-row:6}.city-btn[data-city="高雄市"]{grid-column:3;grid-row:5}.city-btn[data-city="屏東縣"]{grid-column:3;grid-row:4}.city-btn[data-city="宜蘭縣"]{grid-column:4;grid-row:4}.city-btn[data-city="花蓮縣"]{grid-column:4;grid-row:5}.city-btn[data-city="台東縣"]{grid-column:4;grid-row:6}.city-btn[data-city="澎湖縣"]{grid-column:1;grid-row:3}.city-btn[data-city="金門縣"]{grid-column:1;grid-row:1}.city-btn[data-city="連江縣"]{grid-column:3;grid-row:1}.cards{grid-template-columns:1fr}}

/* V5 管理與圖片 */
.card-img{aspect-ratio:1.45;background:var(--soft,#f0e8df);position:relative;overflow:hidden;border-radius:16px;margin:-1px -1px 10px}.card-img img{width:100%;height:100%;object-fit:cover;display:block}.img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px}.card .card-img .badge{position:absolute;left:10px;top:10px}.edit-btn{font-size:12px!important}.editor{position:fixed;inset:0;background:rgba(30,24,20,.48);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.editor.show{display:flex}.editor-box{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fffdf9;border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.22)}.editor-box h2{margin:0 0 14px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.edit-grid label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}.edit-grid input,.edit-grid select,.edit-grid textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.edit-grid textarea{min-height:120px;resize:vertical}.full{grid-column:1/-1}.edit-actions{display:flex;gap:8px;margin-top:14px}.edit-actions button{flex:1;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.edit-actions .save{font-weight:800;background:var(--soft)}.edit-actions .danger{color:#a44;background:#fff0ee}.manager-note{font-size:12px;color:var(--muted);margin:8px 0 0}@media(max-width:600px){.edit-grid{grid-template-columns:1fr}.full{grid-column:auto}}

.city-checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:6px}
.city-check{display:flex;align-items:center;gap:7px;padding:8px 9px;background:#faf6f1;border:1px solid var(--line);border-radius:10px;font-size:13px}
.city-check input{width:16px;height:16px}
.branch-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin:7px 0}
.branch-row input,.branch-row select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}
.branch-add{margin-top:6px;padding:8px 11px;border:1px solid var(--line);background:#faf6f1;border-radius:9px}
.v6-badge{position:fixed;right:12px;bottom:10px;z-index:999;font-size:11px;padding:5px 9px;border:1px solid var(--line);background:rgba(255,253,249,.94);border-radius:999px;color:var(--muted)}
@media(max-width:600px){.city-checks{grid-template-columns:repeat(2,minmax(0,1fr))}.branch-row{grid-template-columns:1fr 1fr auto}}

</style></head>
<body>
<header><h1>我們的台灣旅遊地圖</h1><p>🐑🫂 IG 珍藏｜美食 × 景點 × 想去的地方</p></header>

<div class="full"><label>分店／區域（可選）</label>
<div id="editBranches"></div>

1","address_city":"高雄市","other_cities":["高雄市"]},{"id":64,"url":"https://www.instagram.com/reel/DX-0wsaPPQW/","type":"Reel","city":"高雄市","category":"美食","caption":"【高雄美食】高雄人氣排隊宵夜店•全新開幕的林記豆漿...🎉🎉🎉\n\n說到北高雄的林記豆漿，相信許多人一定都知道，北高雄宵夜不知要吃什麼，來林記豆漿準沒錯，搬遷後換了新地點營業，少了點老店的味道，那種排長長的流水線夾餐結帳的熱鬧場景已經看不到，現場手作擀麵包餡的煎餃小籠包也看不太到了，進化到用QRCODE掃碼點餐，排隊結帳再等領餐，內用座位多了一些，新增了二樓用餐區，但價格好像有小小漲了一些，不是很確定，不過，老店再漲還是一樣大排長龍，也是有它獨特的魅力在...🤣🤣🤣\n\n餐點部份，我每次來最常點的是他們的煎餃與煎小籠包，皮Q肉餡香，不過這次來不知是不是煎起來放久了，可能沒特別的保溫有小小的冷掉感覺，當然啦他們家的豆漿是我心中的No.1，其它像蘿蔔糕炒蛋，我也挺推薦，而且是現煎的熱呼呼的口感一定吃得到，蛋餅加蛋雙蛋的組合也是必點，他們蛋餅皮很Q也很香我挺喜歡的，不過無論如何，新店新動線也許會有磨合期，也不太會影響它在我們老高雄人心中的地位...😍😍😍\n\n它也是你晚上睡不著時必來買的豆漿宵夜嗎?\n\n1️⃣煎小籠包8顆 NTD 90\n2️⃣蘿蔔糕炒蛋 NTD 65\n3️⃣熱狗蛋餅+荷包蛋 NTD 65\n4️⃣煎餃5顆 NTD 40\n5️⃣豆漿 NTD 25\n6️⃣甜甜圈 NTD 35\n\n📍高雄市鼓山區明倫路46號\n⏰17:00-凌晨01:00\n🚷星期日公休\n☎️07-5537852\n=================================\n#marcoeat高雄 #馬可嚴選高雄美食 #林記豆漿 #高雄宵夜 #高雄小吃","username":"","tags":[],"cities":["高雄市"],"shortcode":"DX-0wsaPPQW","address_city":"高雄市","other_cities":["高雄市"]},{"id":65,"url":"https://www.instagram.com/reel/DX8xUILP9YE/","type":"Reel","city":"桃園市","category":"美食","caption":"📌桃園中壢\n\n朋友帶路才知道中壢藏著一間\n價格平實料理也有特色的串燒居9️⃣屋！\n\n他們店員烤功認真很好\n串燒熟度都超剛好\n醬料調味也不會過鹹\n肉串還會再用噴槍炙燒，香氣更濃\n上桌會附上辛香料\n店內還有各種調味料可以使用\n重口味會愛死🥺\n\n除了串燒也有炸物和特色料理\n最愛他們家胡麻馬鈴薯\n沒想到馬鈴薯和胡麻醬居然這麼搭！！！！\n雞翅外酥內多汁也很讚\n芋粿巧居然還搭配煉乳和花生粉\n直接變身成甜點\n看店名那麼兇還以為料理可能是大老粗（？）風格\n沒想到意外滿注重細節🤣\n\n不但能內用也可以用九折外帶回家吃！\n整體體驗挺不錯的\n推推！\n\n/\n\n📌流氓串燒\n🚗桃園市中壢區福州一街38號\n⏰17:00-02:00\n\n/\n\n#中壢美食 #中壢必吃 #中壢餐廳 #中壢聚餐 #中壢","username":"","tags":[],"cities":["桃園市"],"shortcode":"DX8xUILP9YE","address_city":"桃園市","other_cities":["桃園市"]},{"id":66,"url":"https://www.instagram.com/reel/DX6V08Ihn6s/","type":"Reel","city":"桃園市","category":"景點","caption":"桃園隱藏版無邊際，其實不是海。\n第一眼看到這個畫面，真的會誤會自己是不是來到海邊，風、天空、還有那條延伸到盡頭的玻璃步道，像極了國外才會出現的無邊際景色。但其實，這裡就在桃園大溪，一個很多人經過卻沒真正停下來看的地方。\n走上去的那一刻，腳下是透明的玻璃，視線一路延伸到最前方，會有一種「世界好像沒有邊界」的錯覺。尤其當風稍微大一點、水面微微波動，整個氛圍會更像海邊，甚至比海還安靜、更純粹。\n最特別的是，這裡不需要門票，也不用人擠人，就能拍出像出國一樣的畫面。對於喜歡拍照或拍短影音的人來說，這裡真的很適合，一條筆直的步道，加上天空的層次，隨便站在中間都很有故事感。\n如果你最近也想找一個放鬆、又有一點儀式感的地方，不一定要跑很遠。也 雄市"],"shortcode":"DVTYc_EEmJD"},{"id":106,"url":"https://www.instagram.com/reel/DV6ClzTiTal/","type":"Reel","city":"高雄市","category":"美食","caption":"😊高雄人潮滿滿太扯、每樣餐點都超大份又平價！（地址資訊影片最後）\n\n找不到地點的\n下方留「在哪」👇\n我補給你\n\n蒙古烤肉份量很誇張\n直接堆成小山\n\n白飯、雞湯、小菜、\n紅茶竟然還免費吃到飽\n\n四種口味炸雞＋酥炸魚排\n每塊都超大塊\n\n難怪很多人一直來\n\n📍MONGO牧鐵板私廚料理\n⌚11:30-14:00｜17:30-20:30\n（週二休）\n☎️ 0919939957\n\n#高雄美食\n#高雄\n#蒙古烤肉\n#高雄美食地圖\n#高雄美食推薦","username":"","tags":[],"cities":["高雄市"],"shortcode":"DV6ClzTiTal"},{"id":107,"url":"https://www.instagram.com/reel/DT6xOzrkS-w/","type":"Reel","city":"高雄市","category":"美食","caption":"【高雄美食】隱身在高雄巷弄內•日式昭和風格手刷職人抹茶...🍵🍵🍵\n\n如果說高雄最有京都氛圍的手刷抹茶店，這間隱身在衛武營附近的”喫茶鳩谷“絕對是必收藏的口袋名單，老宅改建，裡面充濃厚的日式昭和風格，滿滿老件擺設，加上吧台區可以欣賞老闆手刷抹茶的即視感，加上塌塌米的用餐區域，說他們家最有日本味也絕對沒問題...🇯🇵🇯🇵🇯🇵\n\n喫茶鳩谷，他們家抹茶大都是來自日本的丸久小山圓，而且抹茶粉從淡雅到濃厚的等級都有，甚至也有馬年限定的京都一保堂抹茶，選擇性非常多，超適合愛抹茶的朋友可以細細品味，當然他們家也有焙茶可以做選擇...🍵\n\n喫茶鳩谷的手作甜點也是店內招牌，有抹茶千層、抹茶巴斯克、日本茶生乳三明治蛋糕等，還有現烤滿滿濃厚蜂蜜蛋糕香氣的冰淇淋厚鬆餅也是招牌必點，每日限量，這次去晚了一步沒吃到抹茶千層，但不得不說他們的抹茶巴斯克真的超抹又帶點流心口感也是很討喜，雖然整體價格有低消一杯飲品加一份甜點的限制不算便宜，但用料絕對吃得出來是真材實料，十分值得推薦…💯💯💯💯\n\n1️⃣丸久小山園 聖夜之日 NTD 300\n2️⃣抹茶牛乳 NTD 200\n(丸久小山圈 五十鈴)\n3️⃣鳩谷北海道牛乳冰淇淋鬆餅 NTD 300\n4️⃣極濃巴斯克乳酪蛋糕 NTD 200\n\n📍高雄市苓雅區正義路3巷10號\n(開車停車附近停車格不好找，好找的選公有停車場802醫院附設停車場再步行過去)\n⏰13:00-18:30\n🚷不定時公休，請見店家IG\n🍵店家IG @kissa.hatoya \n☎️0958419680\n(預約制，建議先預約比較保險，當日有現場候位)\n================================\n#marcoeat高雄 #馬可嚴選高雄美食 #喫茶鳩谷 #高雄咖啡廳 #高雄抹茶","username":"","tags":[],"cities":["高雄市"],"shortcode":"DT6xOzrkS-w","address_city":"高雄市","other_cities":["高雄市"]},{"id":108,"url":"https://www.instagram.com/reel/DWJjK_kj0Gd/","type":"Reel","city":"高雄市","category":"美食","caption":"光華夜市附近，好吃的脆焦糖法式吐司大推🍞\n📍≣ #高雄前鎮 ┃Project Dessert Café 甜點方案 ≣\n​\n超美植物系老宅深夜咖啡餐廳🍃\n店內空間帶點復古鄉村風格ꕁ\n先說法式吐司真的大推♡泡滿蛋液好Q軟\n表層帶有焦糖的脆甜，沾上冰淇淋太好吃´͈ ᵕ `͈\n配上一杯我好喜歡的焙茶牛奶，焙茶香明顯\n這裡還有鹹食，奶油烏龍麵蠻濃郁\n拌入明太子口味較重O̤̮K̤̮\n整體我蠻喜歡，推推！\n​\n✎ 脆焦糖法國吐司 $140\n✎ 奶油明太子烏龍麵 $210\n✎ 焙茶牛奶 $140\n​\n#依哩呷高雄 \n📍地址 ​ 高雄市前鎮區廣西路222號\n⟢時間 ​ 週五至日17:00-午夜 /週四16:00-23:00\n⟢ 電話 ​ 無\n⟢ IG ​ @project_dessert \n⟢ 每人低消一杯飲料，客滿用餐時間100分\n⚠️以上皆是個人口感，僅供參考\n​\n#高雄美食 #高雄咖啡餐廳 #高雄咖啡 術，透過對香料的專研，回來之後打造出屬於他們家的獨特風格，透過椒、麻、辣、香，燉煮出不一樣的獨樹一格的美味...👍🏻👍🏻👍🏻\n\n更強的是居然還曾經得到台北牛肉麵節紅燒組的銀牌，一舉打出知名度，太厲害了...🥈🥈🥈\n\n渝味食記重慶小麵，吃得到招牌人氣紅燒牛肉麵、乾拌麵、酸辣粉、重慶麵食、紅油炒手、滷味小菜等多種麵食，而且可加辣也可不辣十分的彈性，最特別的是那現場自助吧的蒜頭與酸菜，想吃多少自己拿，現剝蒜頭配上滷味與麵食一起吃絕對是靈魂所在...💕💕💕\n\n第一次來我極度推薦那“紅燒大腸拌麵，滷大腸十分入味軟嫩好咀嚼，加辣那紅油拌勻後香辣香氣化開後實在是開胃到不行，紅油炒手也是我覺得很特別的地方，他們家都是自家手包的紅油炒手，紅油醬汁麻辣香氣飽滿又帶有椒香味，更特別他們拌入麻醬，這絕對是外面很少見的搭法，吃過讓人難忘，當然來這紅燒牛肉麵也絕對是招牌，紅燒湯頭加入藥材燉煮出滿滿精華，很溫順完全不膩口，愈喝愈香帶出尾韻，加上牛肉塊都有保留住肉的彈牙軟嫩口感，這牛肉麵十分的暖心，想吃辣可以要他們的四川辣椒醬，加一點麻麻辣辣口感層次十足，最後那牛肉酸辣粉也是超多人在點，酸、麻、辣多層口感的湯頭，加上那超Q彈的酸辣粉與紅燒牛肉塊，道地又很耐吃的美味有優秀到，喜歡的朋友可以去吃看看，他們在高雄已經擁有三間店了，有厲害到...👍🏻👍🏻👍🏻\n\n1️⃣川味紅燒牛肉麵 NTD 140\n2️⃣紅燒大腸拌麵 NTD 150\n3️⃣牛肉酸辣粉 NTD 150\n4️⃣四川紅油炒手 NTD 70\n5️⃣地瓜葉 NTD 50\n\n📍高雄市鳳山區光復路一段65號\n⏰11:00-14:00 17:00-20:30\n🚷星期一公休\n☎️07-7102365\n🥈店家IG @yuweishiji \n(渝味食記還有”高醫店“”武廟店“，大家可以去吃一波喔)\n=================================\n#marcoeat高雄 #高雄小吃 #高雄牛肉麵 #高雄美食 #高雄重慶小麵","username":"","tags":[],"cities":["高雄市"],"shortcode":"DVpeySyjzZc","address_city":"高雄市","other_cities":["高雄市"]},{"id":113,"url":"https://www.instagram.com/reel/DWGN5IFExDw/","type":"Reel","city":"桃園市","category":"住宿","caption":"桃園 · 龍潭\n黃爺專業水煎包\n這鍋一打開，\n香氣先走出來。\n熱氣往上，\n一整排水煎包\n靜靜冒著白煙。\n底部煎到金黃，\n一翻，\n亮得像剛醒過來。\n大口咬下，\n底是脆的，\n裡面卻還留著湯汁。\n高麗菜清脆帶甜，\n韭菜濃得剛剛好。\n加上店家特製\n南部辣椒醬，\n越吃越涮嘴。\n很日常卻留在心裡。\n\n#黃爺專業水煎包\n地址：桃園市龍潭區中興路223號\n營業時間：\n06：00至10：30\n\n#streetfood\n#桃園美食\n#龍潭美食\n#龍潭民宿","username":"","tags":[],"cities":["桃園市"],"shortcode":"DWGN5IFExDw","address_city":"桃園市","other_cities":["桃園市"]},{"id":114,"url":"https://www.instagram.com/reel/DWI87PNk_H-/","type":"Reel","city":"高雄市","category":"美食","caption":"高雄邪惡必吃熱狗堡！中午營業到宵夜2:30\n大推：肉醬培根熱狗堡","username":"","tags":[],"cities":["高雄市"],"shortcode":"DWI87PNk_H-"},{"id":115,"url":"https://www.instagram.com/reel/DWI_Txpkm4A/","type":"Reel","city":"高雄市","category":"美食","caption":"高雄也有最古老的羊肉麵！\n老闆特別跑到杭州拜師\n與杭州羊肉麵的創始人學習\n把原汁原味帶回來台灣\n他們家招牌的羊肉麵\n湯頭喝起來清甜又溫醇\n羊肉更是相當入味\n而且一碗就給了好幾塊\n\n想吃更爽一點還有羊大骨湯\n肉質紮實又彈牙\n吃完肉還可以吸骨髓唷！\n另外他們還有賣個人羊肉爐、重慶小麵、手工水餃、紅油炒手、麻辣鴨血、滷味等等….\n選擇非常豐富可以常常去吃\n-\n羊肉麵 $145\n羊大骨湯 $100\n重慶 口的蒸蛋海味十足！\n北海道干貝松葉蟹茶碗蒸，上面放了滿滿的松葉蟹肉和鮭魚卵和一顆炙燒干貝\n\n✨標記好朋友👭🏻一起吃美食吧🤍🤍\n\n-\n🌹 食光約定 @timelesstaste__ \n📪 高雄市左營區榮總路183巷33號\n☎️ 07 310 0298\n⏰ 11:00-14:30 16:30-20:30 週一公休\n-\n #高雄美食 #高雄美食地圖 #高雄美食最前線 #左營美食 #巨蛋美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"DVlX5tEk2b7","address_city":"高雄市","other_cities":["高雄市"]},{"id":125,"url":"https://www.instagram.com/reel/DVdeZCgko4G/","type":"Reel","city":"桃園市","category":"美食","caption":"在龍潭民宅巷弄中找到一間\n沒預訂還真吃不到的烤雞😳\n\n欸我說真的 不要一股腦直接來欸\n烤雞烤魚都要提前預訂！！（烤魚至少一天前預訂）\n現場沒有現成的喔\n\n烤雞使用的是黑羽土雞\n獨家漢方藥材醃漬48小時\n一出爐真的超級香～～～單吃會有淡淡中藥香🤤\n外皮色澤微微焦\n雞皮非常薄Q！！\n肉質紮實彈嫩 搭配很厲害的雞油 哇真的是😋\n\n另外還有賣當日現抓烤活魚\n非常大隻之外 肉質超級鮮甜彈牙🥺\n\n價位這邊\n烤雞一隻💲5️⃣7️⃣0️⃣ （3斤⬆️）\n烤魚一隻💲4️⃣3️⃣0️⃣ （2斤⬆️）\n（假日烤魚限量）\n\n🔍 哲倫撕雞\n📍 桃園市龍潭區梅龍一街50巷24號\n☎️ 0916906806\nLine預訂 ：0916906806\n\n/\n#龍潭 #龍潭人 #龍潭美食 #龍潭烤雞 #龍潭烤魚","username":"","tags":[],"cities":["桃園市"],"shortcode":"DVdeZCgko4G","address_city":"桃園市","other_cities":["桃園市"]},{"id":126,"url":"https://www.instagram.com/reel/DVU80WFkldb/","type":"Reel","city":"待整理","category":"美食","caption":"龍潭4間私心很愛的美食推薦💓\n\n第一間 狠臭臭豆腐\n吃一次就驚艷到整個愛上！口味選擇多元！一份份量很大，才70塊～有夠便宜，臭豆腐一定要戳洞讓醬汁流進去再搭配泡菜一起吃！巨爽\n\n第二間 椒麻滷味\n這間也是吃一次就愛上的店，椒麻醬真的非常厲害，沾什麼都好好吃，個人最愛脆腸跟豬腳，椒麻醬可以請老闆分開裝，這樣大家就可以依照自己口味添加椒麻醬的量，即使搬家到福龍路上，生意還是超級好\n\n第三間 泰香園\n這間應該是走過路過一定會錯過的店！但大家拜託停下來走進去，他們的巴東牛肉飯真的很好吃，直接榮登我的No1 ，泰式炒河粉也很香很夠味\n\n第四間 山野燒烤\n已經回訪超多次！大推他們的胡椒豬肚雞湯，湯頭濃郁又帶點微辣的胡椒味，鍋裡本身料就超多，但如果吃不夠，還可以再加點配料，下酒的串燒還都是銅板價，很推薦多人聚餐去吃\n\n以上都是我有回訪過兩次以上的愛店，也是真心喜歡跟推薦，如果有更好吃的店家也歡迎推薦給我！\n\n更多美食旅遊分享@jj_foodieandtravel \n標籤分類🔖 #JJ呷龍潭\n\n#龍潭美食 #龍潭必吃 #龍潭美食推薦 #平價美食","username":"","tags":[],"cities":[],"shortcode":"DVU80WFkldb"},{"id":127,"url":"https://www.instagram.com/reel/DVSdjjWj659/","type":"Reel","city":"高雄市","category":"美食","caption":"晚上11點就營業的古早味傳統早餐\n奶茶好喝～\n\n#哈班甲蝦米 #傳統早餐 #古早味 #早餐 #早餐店 #早餐店奶茶 #五甲美食 #高雄美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"DVSdjjWj659"},{"id":128,"url":"https://www.instagram.com/reel/DVQfnauE34W/","type":"Reel","city":"桃園市","category":"美食","caption":"💖中壢開幕即爆紅 超可愛甜點店\n如果喜歡我的分享 歡迎追蹤 @jin_fo 絲 $95\n✨脆皮豬五花湯麵 $150\n✨鹹蛋黃叉燒拌麵 $170\n✨豬肉餡餅 $60\n✨塔香豬肉捲餅 $90\n✨酸辣湯 $40\n\n🔍：@suxiangju_tw \n📌：酥香居手作一窩絲（文山店）\n🗺️：高雄市鳳山區青年路二段253號\n🈺：11:30-21:00\n\n🏷️#阿賢吃高雄\n想看更多南部地區美食\n記得追蹤👉 @xiiian_foodie \n-\n#高雄美食 #高雄美食推薦\n#鳳山美食 #高雄必吃","username":"","tags":[],"cities":["高雄市"],"shortcode":"DUh8fEVEoQA","address_city":"高雄市","other_cities":["高雄市"]},{"id":139,"url":"https://www.instagram.com/reel/DUrsrGsEgnY/","type":"Reel","city":"高雄市","category":"美食","caption":"得過鍋燒比賽人氣第一的叻沙鍋燒 還有超好吃的咖椰吐司\n\n近期一定超喜歡的鍋燒店！！\n推薦必點他的叻沙鍋燒\n湯頭非常濃郁 超級好喝！！\n叻沙都是老闆自己調配自己炒的\n剝皮辣椒也很讚\n很喜歡微辣清甜的湯頭\n默默就空碗的那種！\n\n甜點很推薦他的花生巧克力脆薯\n沒吃過的一定要試！\n不違和超級好吃\n還有招牌咖椰吐司\n奶香味很濃郁！！\n\n手抄叻沙鍋燒 $190\n剝皮辣椒鍋燒$210\n咖椰吐司$70\n巧克力花生脆薯$90\n蜜桃紅茶$50\n\n📍謙稻鍋燒\n地址：高雄市左營區子華路45號\n營業時間：11:00-13:00\n  17:30-21:30\n\n#高雄鍋燒 #鍋燒意麵 #咖椰吐司 #左營美食 #謙稻鍋燒","username":"","tags":[],"cities":["高雄市"],"shortcode":"DUrsrGsEgnY","address_city":"高雄市","other_cities":["高雄市"]},{"id":140,"url":"https://www.instagram.com/reel/DUQgqgeEtWG/","type":"Reel","city":"高雄市","category":"美食","caption":"週末男友帶我去的漂亮海景咖☕️\n居然有草莓千層蛋糕！好好吃太幸福了🍓🤤\n海景配好吃的甜點飲品實在太chill～\n\n最喜歡這邊的戶外沙發區躺著超級舒服！\n推薦你們可以傍晚的時候來看日落🌅\n天氣好還可以看到晚霞 真的真的很美✨✨\n\n一定還會再回訪的😻😻\n📍海秋咖啡西子灣店 High Chill cafe\n@highchillcafe \n\n#高雄 #高雄咖啡廳","username":"","tags":[],"cities":["高雄市"],"shortcode":"DUQgqgeEtWG"},{"id":141,"url":"https://www.instagram.com/reel/DUFBfZIknjW/","type":"Reel","city":"高雄市","category":"美食","caption":"【道地東北菜】壽司浪的復興路系列 P4\n\n在高雄新興區的復興路上，有著一間充滿東北味的家鄉菜。沒有多餘的裝飾，門外廚房打理得乾淨只有東北母女忙碌的身影，與撲鼻而來的陣陣醬香。\n這絕對是我吃得最爽的一次醬大骨體驗。\n\n首推招牌鍋包肉，金黃酥脆的外皮裹著酸甜適中的醬汁\n重點是這「小份」的份量，豪邁得讓人驚訝。\n\n接著是台灣少見的蘸醬菜，用乾豆腐皮捲入清脆生菜\n抹上那碟鹹香濃郁的靈魂肉醬，每一口都極其開胃。\n\n特別推薦東北大妹子介紹的松仁小肚\n豬肚包裹著紮實豬肉，口感Ｑ彈且帶有淡淡煙燻香氣，是很有層次的冷盤。\n\n朝鮮拌麵的麵條則是自家手作，Q 彈有勁\n拌入酸甜辣醬後份量大到三個人分食都很足夠。\n\n最後是靈魂核心醬大骨，骨邊肉早已滷得極其入味\n輕輕一撥就骨肉分離，肉質濕潤不乾柴，吃起來真的非常過癮。\n\n若是愛吃辣的人，再來盆紅油發亮、魚片滑嫩的水煮魚，絕對圓滿。\n\n最令人驚豔的是，這樣滿滿一桌豪邁料理，五個人分食結帳人均居然不到 500 元。\n在復興路能遇見這份道地，真的很幸福。\n\n故鄉園大骨頭東北菜\n地址： 800高雄市新興區復興一路51號\n電話號碼： 0906 759 958\n星期三、四  休息\n\n#高雄美食 #高雄小吃 #東北菜 #高雄聚餐 #辦桌菜","username":"","tags":[],"cities":["高雄市"],"shortcode":"DUFBfZIknjW","address_city":"高雄市","other_cities":["高雄市"]},{"id":142,"url":"https://www.instagram.com/reel/DT5UDVHiQis/","type":"Reel","city":"高雄市","category":"美食","caption":"高雄80年老眷村咖啡店！\n藏在左營建業新村的老屋裡～\n這是一間結合喫茶、選物\n和攝影的店，視覺感相當舒服，\n店內的復古氛圍也恰到好處。\n很推薦選個天氣好的日子\n來這坐坐，來杯飲料、吃蛋糕，\n或逛逛店內的織品、陶器選品，\n很chill且不趕時間的小店～\n\n植月選物｜喫茶｜影像\n🏠高雄市左營區緯十路54-9號\n(左營建業新村內)\n☎️0986 970 813\n⏰11:00～20:00（週三公休）\n\n#高雄美食 #高雄下午茶 #高雄咖啡廳 #左營美食 #左營 #左營區 #高雄","username":"","tags":[],"cities":["高雄市"],"shortcode":"DT5UDVHiQis","address_city":"高雄市","other_cities":["高雄市"]},{"id":143,"url":"https://www.instagram.com/reel/DSXZeGRCRSx/","type":"Reel","city":"高雄市","category":"美食","caption":"😊高雄傳說超厲害牛肉麵、份量多味道很好吃！（地址資訊影片最後喔～）\n\n如果找不到地點的話下方跟我說\n我會回你\n\n📍牛忘了呼吸\n\n#高雄美食\n#高雄\n#牛肉麵\n#高雄必吃\n#高雄小吃\n#高雄美食推薦\n#高雄美食地圖\n#平價美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"DSXZeGRCRSx"},{"id":144,"url":"https://www.instagram.com/reel/DT___yXk1Sk/","type":"Reel","city":"高雄市","category":"美食","caption":"#高雄新開幕\n1/23剛開幕的甜甜圈專賣店\n有很多內用座位，也有提供飲品\n甜甜圈目前共7款，其中一款是鹹的\n價格範圍是$40-$85都有\n可以先預訂不怕賣完喔～\n⋯\n🚩 GOLDEN VIBE\n🏛️ 高雄市鼓山區博愛二路312號\n🕒 8:00-22:00\n🍩 每日14:00出爐\n⋯\n#高雄美食 #高雄甜甜圈 #鼓山美食 #左營美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"DT___yXk1Sk","address_city":"高雄市","other_cities":["高雄市"]},{"id":145,"url":"https://www.instagram.com/reel/DTiCqD1D7Zo/","type":"Reel","city":"高雄市","category":"美食","caption":"高雄左營人氣日料餐廳🍱\n必點「鹽烤午仔魚一夜干定食」之外\n近期推出新品「京味壽喜牛食光鍋物」\n嫩到不行的壽喜牛肉沾上濃郁蛋黃\n保證一吃直接上癮😋\n浮誇系「炙燒壽司盛和十貫」\n新鮮厚切超好拍🍣\n別錯過「抹茶布丁」「100%鮮奶酪」完美收尾\n整體氣氛溫馨、價格親民\n難怪常常一開店就客滿\n\n🔎 食光約定\n📍 高雄市左營區榮總路183巷33號\n⏰ 11:00~14:30、16:30~20:30 週一休\n☎️ 07-310-0298\n\n#高雄美食 #高雄 #高雄景點 #高雄必吃 #高雄餐廳","username":"","tags":[],"cities":["高雄市"],"shortcode":"DTiCqD1D7Zo","address_city":"高雄市","other_cities":["高雄市"]},{"id":146,"url":"https://www.instagram.com/reel/DTiEm45k7oN/","type":"Reel","city":"高雄市","category":"美食","caption":"🔥高雄超Chill田園咖啡廳\n想遠離都市就來這家☕️\n同時也是寵物友善餐廳🐶\n烤糖巴斯克上面是炙燒過脆脆的糖\n口感細緻柔軟不甜膩\n蜜紅豆布丁🍮選用大寮紅豆搭配綿密的布丁\n鹹食推薦蒜香炒泡麵和高麗菜豬肉水餃\n炒泡麵很夠味 水餃有眷村媽媽的味道💓\n\n✨標記好朋友👭🏻一起吃美食吧🤍🤍\n\n-\n🌹 夢邸厝樓咖\n📪 高雄市大寮區永芳路57之21號\n⏰ 12:00-21:00 週二公休\n-\n#missJoeyeat高雄 #高雄美食 #高雄美食地圖 #高雄美食最前線 #大寮美食 #高雄咖啡廳 #高雄下午茶 #高雄蛋糕 #高雄甜點 #高雄早午餐 #高雄必吃 #kaohsiungfood #高雄甜點店 #咖啡廳","username":"","tags":[],"cities":["高雄市"],"shortcode":"DTiEm45k7oN","address_city":"高雄市","other_cities":["高雄市"]},{"id":147,"url":"https://www.instagram.com/reel/DTm8BI-j1Hk/","type":"Reel","city":"高雄市","category":"美食","caption":"麻醬濃到會黏嘴唇那種，香氣超誇張\n一碗還會附上 2 片豬肉，完全不手軟\n小菜自己挑，想吃什麼就點什麼\n\n 無辣不歡一定要試辣椒醬\n不是死辣，是會越吃越上癮的那種\n餛飩湯一碗只要 $30\n我每次點都會懷疑老闆是不是算錯 😆\n\n📍 壕記陽春麵\n🏠 高雄市三民區大豐二路303號\n\n⏰ 營業時間\n・週一～週六\n11:00–15:00 / 16:30–19:30\n・週日公休\n\n#麻醬麵 #高雄美食 #三民區美食 #高雄 #高雄美食推薦","username":"","tags":[],"cities":["高雄市"],"shortcode":"DTm8BI-j1Hk","address_city":"高雄市","other_cities":["高雄市"]},{"id":148,"url":"https://www.instagram.com/reel/DSFUzcsE9iZ/","type":"Reel","city":"高雄市","category":"住宿","caption":"要在高雄找到24h包廂漫畫店真的不太容易🫠\n是我認為很適合耍廢、辦公、做報告的好地方 ～\n也算是個I人天堂了\n\n對了抵銷只要$80（以小時計算）\n充電、淋浴、WiFi、行李寄放都有👌\n 地址：新興區中正二路220號2f\n \n#高雄漫畫咖啡廳 #高雄 #高雄宵夜 #高雄住宿休息 #漫畫店","username":"","tags":[],"cities":["高雄市"],"shortcode":"DSFUzcsE9iZ"},{"id":149,"url":"https://www.instagram.com/reel/DRmSjBOkzm9/","type":"Reel","city":"高雄市","category":"美食","caption":"義大利人開箱高雄唯一一間羅馬豬肉捲專賣店🇮🇹\n\n跟大家介紹苓雅區的「TAGL」，在這裡可以吃到外皮金黃酥脆的羅馬經典小吃「Porchetta Romana」這家店原本在自由黃昏市場擺攤，後來搬到捷運三多商圈站附近設立店面。羅馬豬肉卷是使用整塊豬五花捲起，加入 7 種義式香料🌿香料味道非常明顯。這家的外皮在經過高溫烘烤後會膨脹爆開💥每一口都可以聽到清脆的喀嚓聲，很爽🤌裡面仍保持軟嫩多汁，是在台灣相對少見的羅馬街頭美食。而他們的Porchetta有兩種吃法，單吃切片肉捲跟招牌三明治。單吃切片肉捲每片會切的比較厚一點，很適合當下酒菜，很適合找朋友一起分食，可以更好的享受Porchetta的原汁原味～\n\n我跟義大利朋友最推薦他們的招牌三明治🥪麵包可以選口感較Q的「Ciabatta」或酥脆的「Focaccia」，都是義大利常見的經典麵包款式。三明治裡加入厚切 Porchetta，再搭配三種醬料：微辣的義式辣醬「salsa piccante」老闆自製的甜味焦糖洋葱，跟義式青醬「Pesto」。焦糖洋蔥的甜味能中和 Porchetta 原本偏鹹的味道，讓Porchetta三明治的整個口感直接大升級🤩比例設計得很好。老闆每天都會新鮮製作 Porchetta，通常都會在當天完售，非常搶手～\n\n餐廳地址：高雄市苓雅區仁義街4-3號（距離捷運三多商圈站走路5分鐘）\n\n營業時間： \n週一至週三 12:00–20:00 \n週五至週日 12:00–20:00 \n週四公休\n\n#TAGL #高雄美食 #高雄餐廳 #苓雅區美食 #台灣美食 #義式豬肉捲 #豬肉捲 #porchetta","username":"","tags":[],"cities":["高雄市"],"shortcode":"DRmSjBOkzm9","address_city":"高雄市","other 闆使用米漿&蘿蔔絲製作\n口感綿密清甜 淋上獨家特製肉燥醬料甘醇順口\n敢吃辣推薦加手炒辣椒醬\n還可以升級加荷包蛋更滿足\n\n一定要試試自製粉漿現煎的九層塔蛋餅\n軟Q蛋餅加上脆脆九層塔\n每一口都有濃郁香氣\n也有搭配勾芡的肉燥淋醬 滑順香醇很唰嘴\n\n- - - - - - - -✂️ - - - - - - - -\n限量供應,售完即止\n—————————————\n菜頭粿加蛋 大 65元\n九層塔蛋餅45元\n—————————————\n🎀 #葉家菜頭粿粉漿蛋餅 義民總店\n🏠 高雄市三民區褒忠街114號\n🚌 搭乘公車(紅28公車式小黃/紅28延公車式小黃)至大昌二路口步行約200公尺(1分鐘)\n☎️ 0989-215558\n⌚️ 週二至週日 06:30-11:00(售完即止)\n🚷 週一店休\n—————————————\n#taiwan #taiwanfood\n#kaohsiung #kaohsiungfood\n#虎麗 #hoolee #虎麗笑嗨嗨\n#虎麗吃高雄 #高雄虎麗 #三民虎麗  #虎麗吃三民\n—————————————\n#高雄#高雄美食#三民#三民美食#三民區#三民區美食#高雄早餐#高雄蛋餅#高雄粉漿蛋餅#高雄小吃#高雄蘿蔔糕#高雄菜頭粿#高雄必吃#高雄古早味#高雄美食推薦","username":"","tags":[],"cities":["高雄市"],"shortcode":"DHLyYPQzehi","address_city":"高雄市","other_cities":["高雄市"]},{"id":212,"url":"https://www.instagram.com/reel/DL10Ki8xoOT/","type":"Reel","city":"桃園市","category":"美食","caption":"藏在平鎮巷弄內高質感台式料理🤩\n隱藏版的功夫台式熱炒個人套餐\n只有平日晚上才吃得到\n而且還有宵夜場！\n\n首推腰果炒宮保雞丁\n不是印象中的那種傳統的宮保雞丁\n特別加入腰果一起拌炒香氣更突出\n雞肉超嫩醬香夠味帶有微微的辣度\n完全是白飯殺手🤤\n\n還有餐廳才有的功夫菜\n清蒸現流海鱸魚每日新鮮直送\n使用清蒸保留食材原味\n最後淋上燒熱的新港香油激發出香味\n肉質細嫩、魚肉鮮甜\n喜歡吃魚的一定要點🥰\n\n每份套餐皆附白飯、兩樣自製小菜\n、飲品、甜點、飲品還可以升級成功夫燉湯\n吃完真的很滿足有家常菜的療癒好味道😋\n\n假日會變成週末早午餐小館\n主打手工義大利麵與豐盛早午餐盤加上炭火料理￼\n不管你是喜歡中式還是西式\n這間都讓你一試成主顧❤️‍🔥\n-\n🔸腰果炒宮保雞$280\n（+$99升級套餐/+$49升級湯品）\n🔸清蒸現流海鱸魚$300\n🔸采風週末大早餐盤$320\n-\n📍平鎮·采風小館\n🕒平日17:30-23:30\n假日及連假10:00-16:30\n🚙桃園市平鎮區廣德街77號\n\n#吃一口桃園#平鎮美食#平鎮小吃#平鎮餐廳#桃園美食#桃園必吃#桃園早午餐#中壢早午餐#台式料理","username":"","tags":[],"cities":["桃園市"],"shortcode":"DL10Ki8xoOT","address_city":"桃園市","other_cities":["桃園市"]},{"id":213,"url":"https://www.instagram.com/reel/DMt31mQRGJt/","type":"Reel","city":"高雄市","category":"美食","caption":"【高雄美食】Shofar武廟號角麻辣燙•原住民媽媽的暖心麻辣燙關東煮...💕💕💕\n\n第一次遇到這麼熱情的原住民老闆娘，夾個麻辣燙關東煮可能看我用手機在拍，很自豪的對他們家的湯頭與食材充滿滿滿的信心，也在聊天的過程當中，看到了媽媽對女兒的愛心，老闆娘說他們家的湯連女兒都從小喝到大...💕💕💕\n\n先說結論，絕對會再二訪三訪的，它絕對是一間我吃完麻辣燙，整個人完全不燥熱，是很舒服又安心的及關東煮非常清甜不會口乾舌燥的麻辣燙/關東煮專賣店.....💯💯💯\n\nShofar武廟號角麻辣燙關東煮，原住民媽媽做的麻辣燙關東煮，十幾種辛香料及天然蔬果熬煮麻辣湯頭與關東煮湯頭，還有對食材的處理也是以”家人要吃的“為出發點，是一間讓人十分安心的麻辣燙關東煮專賣店，而且湯頭甘醇，沒有過重的調味料與雜味，讓人吃完後完全不膩口也不燥熱，是一間很舒服的麻辣燙關東煮專賣...💕💕💕\n\n如果你有來這，青菜類我超推薦必夾，他們青菜類吃起來是又嫩又脆口，還有那生豆包嫩嫩口感超推薦，當然他們的招牌麻辣鴨血豆腐也是超 ["高雄市"],"shortcode":"DHsmRlpRYQ2","address_city":"高雄市","other_cities":["高雄市"]},{"id":251,"url":"https://www.instagram.com/reel/DGx5sN4TKPn/","type":"Reel","city":"高雄市","category":"美食","caption":"布丁控必喝!! 方塊焦糖布丁奶茶\n\n這家遵循古法熬煮古早味涼水\n堅持選用天然食材\n不添加人工香精或加工物\n讓大家能喝得安心滿足\n\n布丁控一定要試試 焦糖布丁奶茶\n手工製作的焦糖熟布丁\n只加牛奶＋有機雞蛋＋手作焦糖醬\n口感綿密充滿蛋香及焦糖甜味\n搭配特調鮮奶茶很好喝\n\n喜歡酸甜滋味必喝梅綠凍飲\n手切梅肉熬煮梅汁 冰鎮製成Q彈梅凍\n搭配梅汁與台灣綠茶特調的茶湯\n酸甜富含茶香 會讓人一喝就停不下來 \n\n來這裡也可以品嚐經典茶飲\n像是獨家調配比例的古早味紅茶\n喝起來甘醇不澀口\n還有不加茉莉花薰香的台灣綠茶\n入口充滿茶香又會回甘的鮮萃四季春\n\n- - - - - - - -✂️ - - - - - - - -\n有提供外送服務!!\n—————————————\n焦糖布丁奶茶 65元\n梅綠凍飲 45元\n古早味紅茶 25元/杯 \n台灣綠茶 50元/瓶\n鮮萃四季春 30元/杯\n—————————————\n🎀 #山大和茶鋪\n🆔 @shandahetea\n🏠 高雄市前鎮區正勤路73號（中華路好市多旁）\n🚇 捷運獅甲站1號出口步行600公尺約9分鐘\n☎️ 07-5366118 \n⌚️ 週一至週六 09:30-20:30 (茶品售完為止，售完即打烊)\n🚷 週日店休\n⭐️ 建議事先透過線上訂購或電話預訂，節省排隊時間\n⭐️ 加入官方LINE預訂：@417fktkm\n—————————————\n#taiwan #taiwanfood\n#kaohsiung #kaohsiungfood\n#虎麗 #hoolee #虎麗笑嗨嗨\n#虎麗吃高雄 #高雄虎麗 #前鎮虎麗  #虎麗吃前鎮\n—————————————\n#高雄#高雄美食#前鎮#前鎮美食#前鎮區#前鎮區美食#高雄飲料#高雄飲料店#高雄布丁#高雄甜點#高雄奶茶#布丁奶茶","username":"","tags":[],"cities":["高雄市"],"shortcode":"DGx5sN4TKPn","address_city":"高雄市","other_cities":["高雄市"]},{"id":252,"url":"https://www.instagram.com/reel/DHBAxNcyjfd/","type":"Reel","city":"高雄市","category":"美食","caption":"「高雄美食－前金區」\n#和村日本料理\n\n最近挖掘到一間開到凌晨1:00的日式定食！\n位於前金區七賢路上，總共有兩層樓 2樓都是和室座位區個人大愛❤️\n\n餐點類型有定食、烤物、炸物、煎炒物..等類型都超多\n\n🍳漢堡排蛋包飯定食是招牌，一桌只能點一份，漢堡排厚度很夠，淋上特製醬汁配上飯&蛋一起吃超滿足，會有飽足感！\n\n🦞海線控我推海鮮定食，有大炸蝦、魷魚圈、牡蠣、竹莢魚，份量也不少，剛好四道海鮮都是我愛的👍\n\n🍪可樂餅的內餡很濃郁也很大塊，個人喜歡！\n\n定食也會附上湯品、小菜、水果，整體蠻豐盛的\n樓下黑板也會有當日限定餐點，也可以參考\n\n🟣招牌漢堡排蛋包飯定食 $280（一桌限點一份） 🟣酥炸綜合海鮮定食 $3202/u $ \n\n—————————————\n🟪餐廳名稱：和村日本料理\n🟪餐廳地址：高雄市前金區七賢二路278號\n🟪營業時間：17:00-01:00（週一固定公休）\n\n#Hsiaoyoseat #跟著Hsiaoyoseat屌店很容易 #高雄美食 #高雄日本料理 #高雄日式料理 EL m #高雄定食 #高雄晚餐E #高雄宵夜  #Kaohsiung #Kaohsiungfood #前金美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"DHBAxNcyjfd","address_city":"高雄市","other_cities":["高雄市"]},{"id":253,"url":"https://www.instagram.com/reel/DG5N1NQyOoJ/","type":"Reel","city":"高雄市","category":"美食","caption":"「高雄美食－三民區」\n#羅記炒河粉\n\n下班愛外帶晚餐回家吃的，這間記下來！\n份量超多又超香的河粉，下班的飢餓由他幫你解決🤤\n位於熱河街只做外帶的河粉專賣店！\n\n🇭🇰第一次來選擇障礙就點乾炒河粉，河粉的Q度剛好，充滿鍋氣超級香，招牌不會錯！\n\n🇲🇾愛吃辣的可以點馬來西亞炒粿條，辣度可以做調整，香辣的口感很開胃，適合來杯飲料一起享受\n\n🍝廣東炒麵是我的Top1，如果跟我一樣不吃豆芽就點他，沒豆芽有不違和，麵條的軟度剛剛好也超入味，大力吸麵很過癮！\n\n整體的餐點都很夠味，麵&配料的份量都不少，整體吃起來會有飽足感的 （也可以跟我一樣不豆芽政策，記得先跟老闆備註）\n\n因為只有老闆一人作業，建議可以先電話預訂，不然到現場要耐心等候一下唷！\n\n🟣招牌港式乾炒河粉 $130\n🟣馬來西亞炒粿條 $140\n🟣廣東鼓油皇炒麵 $130 （會因主食不同有價差）\n\n—————————————\n🟪餐廳名稱：羅記炒河粉\n🟪餐廳地址：高雄市三民區朝陽街30號\n🟪營業時間：17:00-20:00（週一固定公休，其餘公休日請至官方ig： @mrs.luo_)\n🛒中午可接受訂餐，外送 10碗起送，需提早2天訂餐\n☎️電話號碼：0900173198（可以電話提早訂餐）\n\n#Hsiaoyoseat #跟著Hsiaoyoseat屌店很容易 #高雄美食 #高雄河粉 #高雄炒河粉 #高雄晚餐  #Kaohsiung #Kaohsiungfood #三民美食 #熱河美食 #吉林美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"DG5N1NQyOoJ","address_city":"高雄市","other_cities":["高雄市"]},{"id":254,"url":"https://www.instagram.com/reel/DGk0043S6Kj/","type":"Reel","city":"高雄市","category":"美食","caption":"這是我目前吃過CP值最高的麵店了\n湯頭多種選擇性很多\n一碗麵可以免費加麵一次\n份量上也很足夠！\n\n有貴賓卡還會招待一杯飲料\n上次我們一家四口吃完居然才$300初\n好划算！\n\n📍甘泉魚麵\n高雄市左營區重愛路306號\n07-3455055\n\n#高雄 #高雄美食 #高雄景點 #高雄小吃 #高雄美食推薦 #高雄美食部落客 #高雄美食地圖 #左營 #左營美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"DGk0043S6Kj","address_city":"高雄市","other_cities":["高雄市"]},{"id":255,"url":"https://www.instagram.com/reel/DGuvaTVzwYg/","type":"Reel","city":"桃園市","category":"美食","caption":"桃園中壢新開幕，餡料滿滿的芝士烤冷麵\n一份重量真的很重，老闆娘很用心\n在Google上也有不少人誇獎這家用料實在，份量也很足\n很喜歡他們帶有微微甜的刷醬，讓整個口感提昇另一個層次\n\n招牌烤冷麵會加入火雞麵、蛋、拉絲起司、熱狗、玉米\n每一口都是滿滿的料，很貼心老闆會詢問是否要辣\n不敢吃辣也有不辣的麵喔!\n\n招牌烤冷麵 $150\n小資烤冷麵 $100\n東北烤冷麵 $90\n\n🏠芝士火雞烤冷麵（中壢總店）\n📍桃園市中壢區民有街21-3號\n\n#桃園新開幕 #新開幕 #試營運 #芝士火雞烤冷麵 #中壢美食推薦 #中壢美食","username":"","tags":[],"cities":["桃園市"],"shortcode":"DGuvaTVzwYg","address_city":"桃園市","other_cities":["桃園市"]},{"id":256,"url":"https://www.instagram.com/reel/DGhM3oaSm9b/","type":"Reel","city":"高雄市","category":"美食","caption":"月底救星😍😍😍\n排骨飯+半熟蛋+肉燥飯+南部最愛小肉豆！這樣75元！\n當地隱藏的早餐店！誇張下午一點多還那麼多人！\n老饕都點排特餐（排骨特餐）\n搭配一杯珍奶🧋只要30元！\n\n📍慧茗精緻美食\n🚗802高雄市苓雅區三多二路61號\n⏱️0700-19:00\n🌭🌭#跟著希希吃高雄","username":"","tags":[],"cities":["高雄市"],"shortcode":"DGhM3oaSm ！這間串燒店絕對要去吃，烤工好服務親切，重點價格也是包滿意，親民不貴千元初就超澎湃，店內座位也是寬敞，共有兩樓空間聚餐也可以約\n\n店內採單點即烤即上，上桌都可吃到最佳風味！串燒推薦超嫩的金璟雞山葵里肌，烤到2-4分的熟度，口感軟嫩不腥好厲害！還有牛舌元寶也要點，口感會爆漿實在銷魂～特別的還有去骨雞爪，口感Q彈入味，可以沾蛋液增添口感，風味十足\n\n來這裡超推釜飯，但每日數量有限記得要預訂！燈籠釜飯是生米加入炒過的玉米及鴻禧菇，最後搭配一顆顆燈籠悶煮，吃起來粒粒分明，玉米散發出自然甜味，真的好好吃，還有大小份可以選\n\n不只如此他們家主廚菜色也是很厲害！威靈頓風炸豬排別處吃不到，一口咬下好酥嫩，內層包有培根及蘑菇醬，搭配豬排醬，吃起來每口都是驚喜！最後甜點也好有特色，是獨家研發櫻花蝦杏仁脆片，以蛋白霜為主體，加上草莓醬、優格醬、花椒油，吃起來很有層次，小朋友也會喜歡\n-\n#牛舌元寶$60\n#去骨雞爪 $90\n#金璟雞山葵里肌 $90\n#葛瑪蘭黑豬肉 $70\n#月見雞肉丸子 $70\n#酥炸櫻花蝦餅 $220\n#威靈頓風炸豬排 $180\n#燈籠雞鬆釜飯 $680（小份）\n#自製漢堡排 $220\n#櫻花蝦杏仁脆片 $120\n-\n📍串吧酒食居 @zhuyinbar \n地址：高雄市前金區新盛二街54號\n電話：07-221 2069\n營業時間：18:00~01:00\n🚷週一、週二公休，每人低消$500\n-\n#串吧酒食屋 #串吧 #高雄晚餐 #高雄宵夜 #高雄串燒 #高雄豪吃 #前金豪吃 #前金美食 #前金區 #高雄 #高雄美食 #kaohsiung","username":"","tags":[],"cities":["高雄市"],"shortcode":"DFpRVqdyioN","address_city":"高雄市","other_cities":["高雄市"]},{"id":268,"url":"https://www.instagram.com/reel/DFpYp5Nzp6c/","type":"Reel","city":"桃園市","category":"美食","caption":"桃園也有撿便宜NG蛋糕🤩🤩\n絕對是小資族的月底救星\n\n我們當天是買提拉米蘇和芋頭口味\n我個人比較推薦芋頭裡面還有芋泥滿好吃的\n除了外觀比較不好看但味道完全沒影響🤣🤣\n\n🔸任選一盒$55/三盒$150\n\n📍平鎮·中原NG蛋糕\n🕒9:30-20:00\n🚙桃園市平鎮區延平路二段430巷45號1樓\n\n#吃一口桃園#桃園美食#桃園蛋糕#桃園甜點#中壢美食#中壢蛋糕#中壢甜點#平鎮美食#平鎮蛋糕#平鎮甜點#蛋糕#ng蛋糕#撿便宜","username":"","tags":[],"cities":["桃園市"],"shortcode":"DFpYp5Nzp6c","address_city":"桃園市","other_cities":["桃園市"]},{"id":269,"url":"https://www.instagram.com/reel/DFosf3Yzbc6/","type":"Reel","city":"高雄市","category":"美食","caption":"道地的河南雞蛋灌餅\n下午時段開賣\n餅皮酥酥脆脆的口感我很喜歡\n配料有秘制辣醬、生菜、雙蛋一份$60\n還可以額外再加料\n我偶爾會買這個當晚餐！會飽\n回訪多次推薦給你們♡ \n\n-\n\n📍河南信陽烤爐雞蛋灌餅\n·營業時間：14:00～19:00\n·地址：高雄市鳳山區大明路194號\n🚷週一、週四公休\n\n#高雄#高雄美食#高雄下午茶#高雄小吃\n#雞蛋灌餅#鳳山#鳳山美食#河南信陽烤爐雞蛋灌餅","username":"","tags":[],"cities":["高雄市"],"shortcode":"DFosf3Yzbc6","address_city":"高雄市","other_cities":["高雄市"]},{"id":270,"url":"https://www.instagram.com/p/C7RCPJ0S50C/","type":"Post","city":"高雄市","category":"美食","caption":"巴格浪又更新菜單啦📣\n\n🕰️營業時間：17:00～02:00 (週一公休)\n📞訂位專線：07-222 0296\n🏠地址：高雄市苓雅區福建街379號\n\n#高雄美食 #高雄 #高雄餐廳 #高雄宵夜 #巴格浪 #巴格浪原民居酒屋 #原住民 #特色餐廳 #居酒屋 #啤酒 #小米酒 #美食 #餐廳 #宵夜 #特色 #藍色狂想 #麗尊酒店","username" city":"高雄市","other_cities":["高雄市"]},{"id":321,"url":"https://www.instagram.com/reel/C-mnmTQy6VM/","type":"Reel","city":"高雄市","category":"美食","caption":"#被甜點耽誤的飲料店 #舒芙蕾 #片尾有資訊\n-\n老實說之前也常來買他們家舒芙蕾，但其實飲料也很厲害！真的是相見恨晚了🤣選擇多而且每杯都很用心製作，有小農茗茶、鮮乳系、奶霜系列、水果特調，竟然還有賣奶昔，是不是選擇困難症要發作了～也很適合公司行號訂飲料，種類多元是下午茶好選擇，當然還能外帶舒芙蕾唷\n\n他們家我喜歡甘梅多多綠，一次就是兩瓶多多搭配梅子粉，酸甜爽口很消暑～鮮奶茶系列可以點，使用真的鮮乳不加奶精，搭配粉粿跟紅豆更滿足～他們家奶蓋也滿厲害的，第一次喝到芋頭口味，濃郁香甜融合茶飲剛剛好！\n\n如果想來點冰沙和奶昔，我會推薦凍芝少女草莓，使用草莓打成冰沙，搭配綿密奶蓋，喝起來好有層次！這裡還有少見的奶昔，抹茶奶昔真的有茶香，口感滑順綿密小朋友也會很喜歡\n-\n#紫芋香緹奶霜 $60\n#紅豆粉粿鮮奶茶 $65\n#甘梅多多綠 $50\n#百香綠啵啵 $60\n#日式厚抹茶奶昔 $90\n#凍芝少女草莓 $85\n-\n📍六盛茶苑 富民店 @liushengtea_jilin\n地址：高雄市左營區富民路151號\n電話：0971885077\n營業時間：11:00-21:00\n🚷公休日：週日\n\n🔻其他門市\n吉林店、仁雄店、鹽埕埔店\n文山店、屏東成功店、楠梓店（9月底開幕）\n-\n#六盛茶苑 #高雄飲料店 #高雄飲料 #左營美食 #左營豪吃 #高雄豪吃 #高雄 #高雄美食 #kaohsiung","username":"","tags":[],"cities":["高雄市"],"shortcode":"C-mnmTQy6VM","address_city":"高雄市","other_cities":["高雄市"]},{"id":322,"url":"https://www.instagram.com/reel/DAm9MH5uJKV/","type":"Reel","city":"高雄市","category":"美食","caption":"#ccceat高雄 \n太誇張了🔥點「燒肉丼飯」附「十勝濃乳舒芙蕾+冰淇淋」居然只要$260！藏身在巷內住宅區的隱藏版美食，CP值未也太高了吧😍\n▪️火烤伊比利豚雪花丼定食$260\n▪️火烤牛胸腹+豚雪花丼定食$280\n👉🏻炙燒濃乳焦糖舒芙蕾\n👉🏻Oreo巧克力舒芙蕾\n舒芙蕾多達7種口味可以選擇，口感蓬鬆軟綿、濕潤、入口即化，和友人都被驚艷到✨\n燒肉丼飯可選擇雙拼同時吃到豬肉與牛肉對選擇障礙的朋友很友善🤣🙌🏻燒肉帶點微焦香氣，醬汁鹹甜濃郁，給的很足夠相當下飯，兩顆生蛋黃劃破拌入飯中增添蛋香更好吃🤤，不敢吃生蛋黃的話也可以選溏心蛋唷！\n🔺內用採預約制 @sen_mu2024 \n📍森目—高雄市三民區義和路61巷27號\n#kaohsiungfood #가오슝 #가오슝맛집 #가오슝여행 #대만 #대만여행 #相機食先 #高雄美食地圖 #人氣美食 #高雄美食 #高雄小吃 #高雄必吃 #高雄一日遊 #高雄甜點 #舒芙蕾 #新開幕 #高雄日式 #高雄巷弄美食 #森目","username":"","tags":[],"cities":["高雄市"],"shortcode":"DAm9MH5uJKV","address_city":"高雄市","other_cities":["高雄市"]},{"id":323,"url":"https://www.instagram.com/reel/DBFtwwtSZZM/","type":"Reel","city":"高雄市","category":"美食","caption":"【高雄美食】肯得福政德店•傳說中的排隊蔥蒜香雞排...🉐🉐🉐\n\n沒想到，居然還有鹽酥雞店不預定可能會等超久的店在左營，今天來分享這間”老闆蔥蒜加到爆“的鹽酥雞，傳說中的人氣排隊店”肯得福政德店“...🈵🈵🈵\n\n身為蔥蒜控的我，一整個被這間店燒到，一定要朝聖一下的，點了蔥蒜香雞排，看到老闆瘋狂加蔥加蒜我也傻眼了，不過現場點其它品項，發現老闆也是瘋狂加蔥蒜這不吃爆它真的不行，他們家招牌是香雞排，是那種古早味的炸粉我喜歡，酥脆的古早味香雞排搭配滿滿蔥蒜味吃超帶勁，還有必點酥炸大魷魚真的有大隻到，新鮮又彈牙我喜歡，其它招牌炸雞翅與三角骨，啃起來絕對是津津有味，他們家也有炸櫛瓜、小黃瓜、玉米筍、魚薯條、手工黑輪、雞七里香等各種選擇，下午茶宵夜吃這絕對 68\n⛩️苓雅區自強三路134號 三角窗\n\n🐮和牛口味 記得預約\n🐮和牛口味 記得預約\n🐮和牛口味 記得預約\n\n雖然我沒法給你一座城堡.但是我可以為你做好吃的蛋蛋堡🍔\n#下午茶 #高雄下午茶 #點心 #高雄美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"DADMdcPvNNs"},{"id":327,"url":"https://www.instagram.com/reel/DAQXVJySwCt/","type":"Reel","city":"高雄市","category":"美食","caption":"「高雄美食－鹽埕區」\n#梅吃夠 #梅吃夠鹽焗雞專賣戶\n\n有習慣外帶烤雞烤魚回家吃的家庭\n這間就是為你們而生🔔\n重點是「一定要電話預訂📱」\n\n🐔鹽焗雞有胡椒&梅子兩種口味，都是用整隻雞下去製作，鹽焗的烹飪手法讓肉質超嫩，一拔就是骨肉分離的程度\n>梅子是全台首創口味，吃起來會甜甜的滋味，突破以往烤雞都是重鹹口味的口感\n>胡椒雞就是經典口味，烤雞加上胡椒鹽就是經典不敗，一樣愛吃鹹味的就點胡椒雞\n\n🐟酥皮魚個人也超愛，吃的時候記得先把外皮剝掉，裡面會附檸檬&胡椒鹽（個人習慣都有加），烤的也超級香魚肉也超嫩，愛吃魚的也大推\n\n一隻雞的份量大概2-3人食用差不多，都是剛出爐超級燙記得小心燙嘴，很適合跟朋友or家人在家聚餐外帶去吃💯\n\n🟣鹽焗梅子雞 $600\n🟣鹽焗胡椒雞 $600\n🟣燒烤酥皮魚 $320\n\n—————————————\n🟪餐廳名稱：梅吃夠 鹽焗雞專賣戶\n🟪餐廳地址：高雄市鹽埕區大勇路50-2號\n🟪營業時間：15:00-22:00 (週一、週四固定公休）\n\n#Hsiaoyoseat #跟著Hsiaoyoseat屌店很容易 #高雄烤雞 #高雄烤魚 #鹽焗雞 #高雄鹽焗雞 #高雄外帶 #高雄聚餐 #Kaohsiung #Kaohsiungfood #高雄午餐 #高雄晚餐","username":"","tags":[],"cities":["高雄市"],"shortcode":"DAQXVJySwCt","address_city":"高雄市","other_cities":["高雄市"]},{"id":328,"url":"https://www.instagram.com/p/DABPa6NynMK/","type":"Post","city":"高雄市","category":"美食","caption":"1元買快樂！通通都是銅板價💰\n吃過這些餅乾的人是不是默默透露了年齡😆\n很多老街夜市都有這樣的攤位～\n懷舊零食糖果～有的1元有的2元🍬\n小時候的快樂真的很簡單啊😌😌\n留言告訴我哪裡還有這種古早味柑仔店！\n\n📍 古早味柑仔店\n🏠 旗山老街靠近旗山車站\n\n┉ ┈ ┉ ┈ ┉ ┈ ┉ ┈ ┉ ┈ ┉ ┈ ┉ ┈ ┉ \n\n🏷 ʜᴀsʜᴛᴀɢs\n#bo__高雄美食 #bo__平民小吃\n#古早味柑仔店 #高雄美食 #高雄景點 #旗山美食 #旗山老街 #高雄銅板美食 #銅板美食 #kaohsiung #kaohsiungfood","username":"","tags":[],"cities":["高雄市"],"shortcode":"DABPa6NynMK"},{"id":329,"url":"https://www.instagram.com/reel/C-caEEoyjkF/","type":"Reel","city":"高雄市","category":"美食","caption":"在地老饕最愛銷魂肉燥飯和虱目魚皮湯，你吃過嗎？\n\n錦娥 肉燥飯 虱目魚粥\n📍高雄市鳳山區文德路17號\n⏱️06:00–13:00(星期日公休）\n\n#高雄美食 #高雄美食地圖 #美食分享 #鳳山美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"C-caEEoyjkF","address_city":"高雄市","other_cities":["高雄市"]},{"id":330,"url":"https://www.instagram.com/reel/DATSglgyLAs/","type":"Reel","city":"高雄市","category":"美食","caption":"高雄人千萬不要錯過\n台南最有名的璞味綿綿冰\n終於開來高雄啦～\n\n奶茶口味豆花配綿綿冰🍧\n料多實在價格又親民\n這不收藏不行吧！\n\n綿綿冰跟一般冰淇淋不一樣\n用天然水果食材製成\n口感吃起來更綿密無負擔\n全天然無添加 ,{"id":334,"url":"https://www.instagram.com/p/DABQqWwz3xi/","type":"Post","city":"高雄市","category":"美食","caption":"小港40年饅頭包子專賣\n#濃郁爆漿巧克力\n\n老闆傳承上一代饒媽的手藝\n將記憶裡的好味道延續\n提供每天新鮮製作出爐的包子饅頭\n\n這裡口味選擇很多 有鹹有甜\n愛吃甜一定要試試巧克力熔岩\n軟綿包子趁熱享用會 有爆漿巧克力餡\n吃起來濃醇苦甜 不膩口\n\n有兩種起士餡的黃金起士包也很推薦\n每一口都有濃郁奶香 鹹鹹甜甜\n\n鹹口味招牌必吃原味肉包\n或 迷你小籠包版本的小鮮肉\n另外還有滿滿青蔥的翡翠香蔥包\n\n素食者就選擇香菇高麗菜包\n餡料脆嫩富含香氣 很像水煎包的風味\n\n繽紛小饅頭 是每週三製作\n門市限量現貨供應 其他時間可以預訂\n\n—————————————\n巧克力熔岩 25元/個\n黃金起士 32元/個\n香菇高麗菜包 30元\n原味肉包 25元/個 \n小鮮肉 11元/個\n繽紛小饅頭 250g 100元(每週三製作)\n—————————————\n🎀 #阡翔饅頭店 小港店 \n🆔 @cs_mantou\n🏠 高雄市小港區福利路11-1號\n🚌 搭乘公車(12/12延駛飛機路/黃2C返程至小港)至民眾服務站步行約95公尺(1分鐘)\n☎️ 0900-635-456\n⌚️ 15:00-19:00／週六公休\n——\n🎀 阡翔饅頭店 林園店\n🏠 高雄市林園區仁愛路135號\n☎️ 0911973638\n⌚️ 15:00-19:00／週六公休\n—————————————\n#taiwan #taiwanfood\n#kaohsiung #kaohsiungfood\n#虎麗 #hoolee #虎麗笑嗨嗨\n#虎麗吃高雄 #高雄虎麗 #小港虎麗  #虎麗吃小港\n—————————————\n#高雄#高雄美食#小港#小港美食#小港區#小港區美食#高雄包子#高雄饅頭#高雄小吃#高雄點心#高雄下午茶","username":"","tags":[],"cities":["高雄市"],"shortcode":"DABQqWwz3xi","address_city":"高雄市","other_cities":["高雄市"]},{"id":335,"url":"https://www.instagram.com/reel/C_cvaIBvnIo/","type":"Reel","city":"桃園市","category":"美食","caption":"︎︎𓂃⟡.·桃園龍潭5間超漂亮 食物又好吃的店\n\n龍潭也超多漂亮店😍環境漂亮食物也漂亮又好吃！\n這裡面也有很多寵物友善店\n而且還有貓貓 狗狗🔥\n食物也都很優秀很有特色 推薦給大家！\n\n01.《PURE純粹手作》\n📅11:30-20:00\n📍桃園市龍潭區五福街48號\n☎️03 470 9299\n這間是以手作蛋糕起家的咖啡廳\n所以他們家的甜點都超有水準🔥\n而且還是寵物友善！！店裡面還有狗狗貓貓\n裡面位置也很舒適 環境也很棒👍\n\n02.《貓禾景觀咖啡》\n📅12:00-2:30\n📍桃園市龍潭區楊銅路二段956號\n☎️0985 376 948\n這間景觀咖啡廳的食物都很推👍\n難得有景觀咖啡廳食物好吃的🥹💖\n除了可以享受環境也可以享受好吃的食物\n裡面也有貓貓可以摸 \n\n03.《SUSUMU》\n📅11:30-18:00(週一二公休)\n📍桃園市龍潭區中興路317巷30弄7號\n☎️03 433 3932\n這間的鹹食和甜食也都很優秀\n而且整間店都很可愛😍食物也很可愛\n整體也很舒適 氛圍很棒 飲料也好好喝\n\n04.《野薑花與貓》\n📅平日11:30-21:00假日11:00-21:00\n📍桃園市龍潭區中興路553巷25號\n☎️0909 133 439\n這間裡面有超多隻貓😍貓控必去\n裡面的食物也很特別！有些還跟野薑花做結合\n店內整體很溫馨舒適 氛圍也很棒\n\n05.《白花花愛吃吃》\n📅10:00-17:00(以粉絲團營業公告為準)\n📍桃園市龍潭區新龍路215號\n這間開的時間比較沒那麼多\n所以想吃要先看粉絲團的公告哦！\n鬆餅真的超好吃😍大推\n\n#龍潭 #龍潭美食 #龍潭景點 #龍潭大池 #龍潭大池 #龍潭甜點 #龍潭咖啡廳 #龍潭區 #龍潭早午餐 #龍潭蛋糕 #龍潭蛋糕 #桃園 #桃園美食 #桃園景點 #桃園甜點 #桃園咖啡廳 #桃園早午餐 #桃園餐廳 #桃園刺青 #reels #reelsvideo #reelsinsta #taoyuan #taoyuanfood","username":"","tags":[],"cities":["桃園市"],"shortcode":"C_cvaIBvnIo","address_city":"桃園市","other_cities":["桃園市"]},{"id":336,"url":"https://www.instagram.com/reel/C_Igfbep8FC/","type":"Reel","city":"高雄市","category":"美食","caption":"吃雞排啦！原味雞排、蔥爆雞排、蒜爆雞排、洋蔥雞排均一價70元，花生雞排跟蘋果雞排需要再加10元～\n\n瑞豐夜市文忠路裡面這家爆力雞，雞排賣最好！！\n其次，魷魚、鹹酥雞、蛋餅皮、雞皮、地瓜、芋頭籤都熱銷，也是晚了就沒有了...\n\n目前吃雞排，不管加爆蔥、爆蒜、爆洋蔥價格都跟原味雞排一樣！\n\n但如果加花生跟蘋果，是另加10元\n這家開到凌晨00點\n➖➖➖➖➖\n📍爆力雞－台式鹹酥雞總部\n地址：鼓山區文忠路64號\n電話：0968702789\n時間：15:00～00:00\n\n#爆力雞 #高雄香雞排 #鼓山香雞排 #高雄鹹酥雞 #鼓山鹹酥雞 #高雄美食地圖","username":"","tags":[],"cities":["高雄市"],"shortcode":"C_Igfbep8FC"},{"id":337,"url":"https://www.instagram.com/reel/C_2vEekyUX-/","type":"Reel","city":"高雄市","category":"美食","caption":"SSR等級海邊夜市｜吹海風逛吃🌊Chill到像在墾丁‼️\n-\n第一次來蚵仔寮夜市，\n迎頭就被徐徐海風給涼爽到了！\n少了其他夜市的悶熱感，\n聽著海浪聲吹著海風吃著炸雞，\n人生至此，夫復何求？\n來說說印象深刻的攤攤🔽\n-\n🌊明志臭豆腐\n剛跟老闆點完餐，\n旁邊的客人就提醒我要加辣椒！\n的確是有實力的辣椒選手，\n辣度非常足夠，香辣爽！\n散發獨特香氣的金黃色臭豆腐，\n送進嘴裡會刮嘴的酥度令人振奮，\n簡直在吃餅乾一樣，考考考！\n臭豆腐的香氣像在嘴裡衝浪，\n👉🏻久久不散！⚠️情侶約會要注意\n-\n🌊中藥炸雞\n當時天色還沒暗，隊伍已不短，\n不喜排隊的我本想放棄，\n但排隊的阿桑說「小賊，這個好粗啦」\n好吧，排！在地人推薦的怎能不吃！\n看著炸雞在油鍋中翻滾，\n金黃色的外衣令人垂涎三尺！\n炸雞腿的麵衣鬆脆、肉質鮮嫩，\n輕咬一口，酥脆的皮和鮮嫩的肉，\n完美結合在口中跳曼巴舞，\n好吃到連骨頭都想啃進肚子！\n在地人推薦的果然沒錯👍🏼\n-\n🌊東山鴨頭\n路過被黑得發亮的食材們吸引，\n夾完食材等待的期間，\n發現有不少客人前來買東山鴨頭，\n大家一夾都是3、400元，\n頓時覺得我是不是夾少了。\n吃了一口發現，\n這絕對是我吃過的東山鴨頭中，\n數一數二的印象深刻！\n外酥內嫩的鴨頭，\n輕輕用手壓一下就皮肉分離，\n入口後甜而不膩，有點偏油，\n甘中帶鹹，焦糖香氣明顯。\n本來想帶回家享用，\n結果在車上就吃完了😆\n-\n蚵仔寮夜市是稀有的「海邊夜市」\n夜市的旁邊就是大海，\n海浪拍打聲伴隨著攤販叫賣聲，\n恍惚間好似有些許「墾丁」氣氛，\n逛個夜市也有度假感💙🩵🤍\n顧客以在地朋友居多，\n攤販的重複性不高，\n其中有很多值得嚐嚐的攤攤，\n我是絕對會再去很多次！\n太太太喜歡蚵仔寮夜市了！🫶🏻\n-\n🧃醋覓Chill Me果醋開團中🧃\n⏳限時9/13-9/20\n-\n🔍 蚵仔寮夜市\n📍 高雄市梓官區光明路130巷\n\n#生雞蛋的沒有 #高雄夜市 #海邊夜市 #蚵仔寮夜市 #高雄美食 #高雄小吃 #夜市小吃 #夜市美食 #路邊攤美食 #台灣小吃 #高雄美食推薦 #高雄夜市推薦 #醋覓","username":"","tags":[],"cities":["高雄市"],"shortcode":"C_2vEekyUX-","address_city":"高雄市","other_cities":["高雄市"]},{"id":338,"url":"https://www.instagram.com/reel/C_xUdc0ytTC/","type":"Reel","city":"高雄市","category":"美食","caption":"#下午茶就吃蛋蛋堡 #高雄也有啦 #文末有資訊\n-\n武聖夜市排隊美食來高雄啦！就是這個超紅的蛋蛋堡，之前看過但沒實際吃過，我必須說真的很好吃👍🏻但製程蠻複雜的，建議可以先打電話訂或者用Line預約比較不用等～\n\n蛋蛋堡共四種口味，有原味、韓式泡菜 68\n3️⃣南乳香酥豬五花 NTD 58\n4️⃣冬蔭海鮮可樂餅 NTD 48\n5️⃣黃金海老天炸蝦 NTD 60\n\n📍高雄市三民區北平一街172巷20號\n(旁邊有收費停車場好停車)\n⏰11:30-20:30\n🚷星期日公休\n☎️07-3229372\n(無法訂位)\n🥄店家IG @nanren_2023 \n=================================\n#marcoeat高雄 #南人飯店 #高雄新店 #高雄新店報報 #三民區 #三民區美食 #高雄美食 #高雄小吃 #高雄午餐 #高雄 #咖哩飯 #乾式熟成 #無國界醬料理 #炸蝦 #高雄美食地圖 #高雄美食部落客 #kaohsiungfood #kaohsiung #相機食先","username":"","tags":[],"cities":["高雄市"],"shortcode":"C6nKWVPR4g5","address_city":"高雄市","other_cities":["高雄市"]},{"id":375,"url":"https://www.instagram.com/p/C8lZpOCh3SQ/","type":"Post","city":"高雄市","category":"美食","caption":"-高雄-🍴粕粕咖哩🍴\n🌟最近讓我吃到為之瘋狂的咖哩店😍，就是這間隱藏在美麗島捷運站裡的「粕粕咖哩」！喜歡吃辣的朋友們，一定要試試印度風咖哩，這個辣度真的有夠過癮🥵，而且這裡的炸物和漢堡排都很好吃耶，還有道地的大阪燒和摩登燒，好加分唷💕\n\n🔺脆脆魚咖哩飯 $280\n🌟「脆脆魚咖哩飯」現炸的魚條好好吃，外皮脆脆的，白身魚吃起來非常嫩！搭配最經典的主廚咖哩，是偏日式口味的濃郁咖哩🍛，吃起來甘甜順口、讓人食慾大開～\n\n🔺炸肉餅咖哩飯 $280\n🌟「炸肉餅咖哩飯」放了2塊炸肉餅，炸肉餅吃起來保有肉汁，而且沒有油膩感(加分!!)；可以+20元升級印度風咖哩，咖哩醬味道超級濃郁，還吃得到碎肉，辣度會慢慢堆疊上去，吃起來特別爽😈\n\n🔺摩登燒 $360\n🌟「摩登燒」是豬肉大阪燒上面加一份日式炒麵，這道真的份量十足，從厚實的橫切面就看得出來有多巨大🤣，醬汁味道很濃厚，滿滿澱粉、非常有飽足感，適合跟大家一起分享！\n\n🔺嫩煎漢堡肉 $150\n🌟都來到日式咖哩店了，不來一份「嫩煎漢堡肉」怎麼行🥹，這裡的漢堡肉是牛肉與豬肉混合，吃起來軟嫩又有肉汁，但卻不會膩，搭配醬汁也非常美味！\n\n📍粕粕咖哩： @popo_curry \n\n☑️高雄市新興區中山一路115號(美麗島捷運站B1)\n☑️電話：07-2366292\n☑️營業時間：平日11:30-14:30/16:30-20:30\n假日11:30-20:30\n\n©️圖文、影片版權皆為「Mandy’s 美食筆記」所有，未經許可請勿轉載使用⚠️\n\n#Taiwan #Kaohsiung #kaohsiungfood #高雄 #高雄美食 #高雄咖哩 #高雄咖哩店 #高雄大阪燒 #高雄餐廳 #高雄必吃 #高雄晚餐 #高雄午餐 #高雄漢堡排 #高雄聚餐 #高雄炸物 #高雄旅遊 #新興 #新興區 #新興美食 #新興區美食 #美麗島 #美麗島站 #咖哩 #咖哩店 #大阪燒 #粕粕咖哩","username":"","tags":[],"cities":["高雄市"],"shortcode":"C8lZpOCh3SQ","address_city":"高雄市","other_cities":["高雄市"]},{"id":376,"url":"https://www.instagram.com/reel/C4jy1Odvn8P/","type":"Reel","city":"高雄市","category":"美食","caption":"🔖這口味厲害了👏\n我先說還挺好吃的\n店名就在影片最後\n-\n#包好吃 #刈包 #高雄 #高雄美食 #高雄甜點 #食尚玩家","username":"","tags":[],"cities":["高雄市"],"shortcode":"C4jy1Odvn8P"},{"id":377,"url":"https://www.instagram.com/reel/C8cVdNiP11J/","type":"Reel","city":"台北市","category":"景點","caption":"台灣首間100%來自韓國的拍貼館！😍\n人真的太多了～～可惜沒拍到電梯場景⋯⋯\n但真的超級值得推薦！！\n\nPLAN.B STUDIO 分店地址\n\n📍新堀江店｜高雄市新興區仁智街294號\n📍桃園店｜桃園市桃園區中正路56號\n📍西門店｜台北市萬華區成都 n\n🏷️食鍋者正宗南洋風味館 @malaysia_foodpot \n☑️高雄市鹽埕區大勇路58號\n☑️電話：07-5219219\n☑️營業時間：11:00-14:00/17:00-21:00(週一公休)\n\n©️圖文、影片版權皆為「Mandy’s 美食筆記」所有，未經許可請勿轉載使用⚠️\n\n#Taiwan #Kaohsiung #kaohsiungfood #高雄 #高雄美食 #高雄小吃 #高雄咖哩 #高雄咖哩飯 #高雄必吃 #高雄雞排 #高雄炸雞 #高雄火鍋 #高雄肉骨茶 #鹽埕 #鹽埕區 #鹽埕美食 #鹽埕區美食 #鹽埕必吃 #高雄午餐 #高雄晚餐 #駁二 #駁二美食 #駁二必吃 #高雄餐廳 #高雄聚餐 #食鍋者正宗南洋風味館 #食鍋者","username":"","tags":[],"cities":["高雄市"],"shortcode":"C8GgLpNBgfU","address_city":"高雄市","other_cities":["高雄市"]},{"id":389,"url":"https://www.instagram.com/p/C8eR9KKPqCz/","type":"Post","city":"高雄市","category":"美食","caption":"🍽｜高雄 #三筋高雄1號店｜\n\n好久沒吃炸豬排，上週假日心血來潮打開手機查了一下看看有沒有厲害的豬排推薦，發現左營這家三筋日式豬排，厚切大塊的照片讓人看得口水直流😋傍晚一開門馬上就來報到品嚐看看！\n\n#起司焗烤豬排\n厚切炸豬排加上起司絲烤過之後，上桌前還特別再撒上起司粉，吃起來起司的味道特別香濃😋\n\n豬排帶著起司整個拉起來牽絲的畫面，讓人抵擋不了😆實在太讚了🉐🉐最厲害的是，吃起來完全不膩口！優秀阿～～\n\n#招牌辛味豬排 \n跟我一樣愛吃辣的朋友有福了，這個辛味豬排，在豬排炸之前就已經有先將辛辣的調味料一同醃製，起鍋上桌前再淋上辣椒籽油跟蔥花，吃起來香辣帶勁～根本就是白飯殺手NO.1\n\n#芒果提拉米蘇\n這個光看就很好吃，實際上也真的很可口🤤\n上層鋪滿了芒果再淋上芒果果醬，非常芒～～～\n下面的起司乳酪跟蛋糕體吃起來不甜膩，搭配上芒果很好吃😋一吃就愛上噎❤️\n\n#蔵前魚柳薯條\n大小朋友的最愛，炸魚是用虱目魚魚柳，吃起來略乾，搭配塔塔醬提供足夠的濕潤度；薯條酥脆好吃，可惜沒有番茄醬😂不然就完美了\n\n#黃金元寶 google評論送的炸元寶，本來以為是炸水餃，結果居然是炸蛋餃，炸過的蛋餃吃起來特別香～意料之外的美味小點\n\n🔸 來這裡用餐，白飯、小菜、高麗菜絲、味噌湯，都讓客人吃到飽喝到撐！大食量的朋友趕緊來吃一波～～～\n\n⚠️食記分享僅供參考，每人口味本就不同，喜好與否見仁見智。\n\n✂️➖➖➖➖➖➖➖➖➖➖➖➖➖➖➖\n🔍 三筋-高雄1號店\n📍 高雄市左營區富民路59號\n🈺 11:00-13:30 & 17:00-20:00\n📞 07-556-1777\n🚷 公休日請查閱google或粉專\n\n#食記 #吃貨 #foodie #kaohsiungfood #高雄 #高雄美食 #左營區美食 #左營美食 #左營 #左營區 #鬍子先生吃豬排 #高雄美食地圖 #高雄美食推薦 #高雄必吃 #鬍子先生吃高雄 #高雄餐廳 #高雄聚餐 #高雄午餐 #高雄晚餐 #高雄豬排 #提拉米蘇 #豬排","username":"","tags":[],"cities":["高雄市"],"shortcode":"C8eR9KKPqCz","address_city":"高雄市","other_cities":["高雄市"]},{"id":390,"url":"https://www.instagram.com/p/C1Wfxacv1-i/","type":"Post","city":"高雄市","category":"美食","caption":"👉🏻 高 CP值平價日式料理‼️\n-\n更多相關文章可參考 @doppo_shokkyaku 呦‼️\n-\n隱藏在文化中心附近的巷弄家庭日式料理\n雖然環境不大 不過可以感受到滿滿的溫馨\n主要提供各種不同的丼飯及烏龍湯麵\n也有一些日式小菜、炸物、燒烤等\n每一道都能感受到滿滿的真材實料\n是百元的價格就可以吃到的高 CP平價美食喔！\n-\n🥔 薯泥沙拉，30元\n必點的招牌開胃小菜之一!!\n一球的薯泥就像冰淇淋一樣\n還放了一小搓的蝦卵作點綴\n光用看的就相當誘人 🤩\n口感濕潤綿密 搭配沙拉醬 \n透出的是淡淡的甜味及馬鈴薯的原味\n整體的口感跟味道都相當特別喔！\n\n🍜 蛤蜊烏龍湯麵，150元\n送上來就能看到滿滿蛤蜊\n全部大約有十多顆左右\n每一個蛤蜊都大顆又飽滿\n使用的是日本讚岐烏龍麵\n吃起來 Q彈又滑順\n湯頭喝起來跟很像日式的壺湯\n同時裡頭了蛤蜊的精華\n喝起來清甜順口完全無負擔\n\n🧀 手作日式起司可樂餅，120元\n這一份是菜單上沒有的隱藏品項\n點餐的時候直接跟店家說就好了\n外皮炸得相當酥脆而且很薄\n一口咬下口感有如餅乾一樣\n除了馬鈴薯外 還有碎肉跟洋蔥\n所以內餡吃起來鮮甜夠味\n不過最誘人的還是起司濃郁的味道\n裡頭的真的是滿滿起司 😍😍\n\n🍗 照燒雞腿丼，150元\n雞蛋跟洋蔥也充滿了醬香 米飯粒粒分明\n鹹甜的醬汁味道剛剛好 完全不會太死鹹\n給的量也剛剛好 每一口飯都吃得到醬味\n雞腿肉吃起來紮實 搭配鹹甜的醬汁很入味\n\n🧈 揚出豆腐，60元\n豆腐一共有三塊!! \n外層的炸皮相當薄 吸滿了鹹甜的柴魚醬油後\n再搭配軟嫩的豆腐 味道相當不錯喔！\n-----------------------------------------------\n🍱 小澤丼日式手作料理\n🌿 高雄市苓雅區泰成街 14號\n☎️ 07 223 1068\n🈺 11:00 - 14:00; 17:00 - 20:00\n🆔 @ozawa_don2231068\n--\n🎵 YOASOBI - 好きた\n--\n📂食客分類\n#苓雅食客\n#日式料理食客\n\n#kaohsiung #kaohsiungfood #kaohsiungfoodie \n#高雄苓雅區 #高雄美食 #高雄平價美食 \n#高雄日式料理 #苓雅區美食 #苓雅美食 \n#日式料理","username":"","tags":[],"cities":["高雄市"],"shortcode":"C1Wfxacv1-i","address_city":"高雄市","other_cities":["高雄市"]},{"id":391,"url":"https://www.instagram.com/p/C8bGivwhzaA/","type":"Post","city":"高雄市","category":"美食","caption":"-高雄-🍴19to1鮮選牛排專賣店🍴\n🌟可以無限加爆牛排的「19to1鮮選牛排專賣店」🥩，不僅肉質超讚、價格也很平價！這間已經在高雄開業20年的牛排館，店內空間超寬敞、很適合約會、聚餐，很多人都從小吃到大😋；自助吧有好喝濃湯、超濃郁醬汁，還有多達20幾種飲料可以無限享用💯\n\n🔺秘製醬燒香煎慢舒牛排100g $349\n🌟喜歡吃牛排的朋友，來這邊一定要吃爆「秘製醬燒香煎慢舒牛排」，鐵板現煎、大火炙烤🔥，肉質非常鮮嫩，淋上秘製醬汁後香氣大爆發，配上綿密的馬鈴薯泥也超級好吃🤤\n\n🔺秘製醬燒台灣豬五花150g $299\n🌟除了牛排以外，「秘製醬燒台灣豬五花」我也覺得非常美味！特別選用台灣豬，大火逼出油脂的香氣，肉質彈牙又鮮美；不吃牛的朋友們，來這裡也可以吃得很開心👍🏻\n\n🔺秘製醬燒低脂嫩雞胸150g $299\n🌟限量的「秘製醬燒低脂嫩雞胸」，需要提前一天預訂唷📲，雞胸有先舒肥過，所以吃起來軟嫩又保有肉汁，我也很喜歡！配上秘製醬汁更是美味大升級💕\n\n📍加入會員即享「秘製醬燒鐵板系列」無限加量優惠，每次加量50%只要50元(以原重量計算)，不限加量次數！\n\n🚩副餐包含：帕瑪森軟法(可續)、自助飲料吧、自助湯品\n🚩加價50元可享：主廚沙拉or每日手工甜點\n（每份餐點最多加點兩次）\n\n《6～8月活動：老顧客回娘家，19請你吃牛排！》\n兩人同行並於點餐時出示店家FB置頂文章留言\n『2020年（含）前，於19to1消費任意截圖紀錄』（ex：臉書、IG打卡、合照、過往的評論或消費明細）\n即可免費獲得「秘製醬燒鐵板系列」(原價349元)乙份\n（肉品三選一：美國法蘭克牛排/舒肥嫩雞胸/台灣豬五花）\n\n📍19to1鮮選牛排專賣店： @19to1_steak \n\n☑️高雄市左營區民族一路948號2F\n☑️電話：07-3599800\n☑️營業時間：11:00-14:00/17:00-20:00\n\n©️圖文、影片版權皆為「Mandy’s 美食筆記」所有，未經許可請勿轉載使用⚠️\n\n#Taiwan #Kaohsiung #kaohsiungfood #高雄 #高雄美食 #高雄必吃 #高雄鐵板燒 #高雄牛排 #高雄豬排 #高雄雞排 #高雄約會餐廳 #高雄午餐 #高雄晚餐 #高雄餐廳 #高雄聚會 #左營 #左營區 #左營美食 #左營區美食 #左營必吃 #文藻美食 #文藻 #牛排 #steak #19to1 #19to1鮮選牛排專賣店","username":"","tags":[],"cities":["高雄市"],"shortcode":" n#肉鬆控看過來 \n#高雄也吃得到小貝!!\n#聽說是小紅書爆紅的點心\n\n第一次看到這種點心耶‼️好特別喔😍\n老闆說是在上海第一次吃到這種點心後愛上\n回台灣自行研究改良，並在鹽埕區的新樂街\n開店販售，除了小貝以外還有販售蛋撻和奶酪\n店面只有外帶沒有提供內用喔～\n⋯\n✨ 招牌小貝💲32 /顆\n✨ 海苔小貝💲34 /顆（人氣NO.1🔥）\n✨ 麻辣小貝💲34 /顆\n·\n鬆軟的蛋糕體塗上奶醬後裹上一層厚厚的\n肉鬆～實在太誘人啦🥹 招牌小貝就是原味\n的肉鬆，吃起來其實有點像肉鬆麵包XD\n外層肉鬆會有脆脆口感，中間則是柔軟蛋糕\n蛋糕體本身相當鬆軟溼潤，一口咬下去超香\n是非常涮嘴的點心喔～老少咸宜😆\n海苔肉鬆多了一股海苔香氣我還蠻喜歡的❤️\n麻辣的很特別！只有前韻微辣口感不會很辣\n-\n✨奶奶小貝💲6 /顆\n✨黑糖小貝💲6 /顆\n·\n這兩款是甜口味的小貝，以單片販售\n奶奶小貝外層居然是奶粉耶！好酷！\n黑糖則是裹上黑糖粉，甜度較高但好吃\n這兩款聽說是小朋友的最愛唷😆\n-\n✨ 原味蛋撻💲40 （人氣NO.1🔥）\n✨ 黑糖蛋撻💲45\n✨ 金沙蛋撻💲45\n·\n他們家的蛋撻也很厲害欸！完全不輸給\n肯X雞蛋撻🤣 外皮超級酥脆而且不油膩\n內餡香甜滑嫩又充滿蛋香，吃上一口超幸福\n喜歡鹹口味也有金沙可以選，超特別的👍🏻\n-\n✨ 濃奶酪系列💲均一價50\n✔️ 口味：原味/黑糖蜜（人氣第一）/鹹餅乾/藍莓\n·\n奶酪口感相當Q彈又入口即化，奶味很濃\n這次吃黑糖蜜口味，有添加龍眼蜜有股特殊\n香氣，搭配奶酪一起吃真的很讚欸🥹\n⋯\n✒️美味：🌝🌝🌝🌝🌘\n✒️再訪：🌝🌝🌝🌝🌘\n⋯\n🏛 高雄市鹽埕區新樂街206-1號\n☎️ 07-531-2022\n🕒 週一～週五 11:00–20:00\n週六、日 11:00–21:00\n🚷 週一公休，如遇連假照常營業\n⋯\n🔍 #丸子吃高雄 、 #丸子吃鹽埕 、 #丸子吃小豬貝貝\n⋯\n#高雄美食 #鹽埕區 #鹽埕區美食 #鹽埕美食 #鹽埕 #鹽埕必吃 #小豬貝貝 #新樂街 #新樂街美食 #大陸美食 #大陸小吃 #大陸甜點 #高雄甜點 #高雄小吃 #高雄下午茶 #下午茶 #小貝 #蛋糕 #肉鬆麵包 #肉鬆 #蛋撻 #蛋塔 #奶酪 #popyummy高雄","username":"","tags":[],"cities":["高雄市"],"shortcode":"CrBARDFPdxg","address_city":"高雄市","other_cities":["高雄市"]},{"id":418,"url":"https://www.instagram.com/reel/C5cux08Pi7R/","type":"Reel","city":"高雄市","category":"美食","caption":"🍙這竟然不是御飯糰！！！🍙\n趕快標記@ 你的朋友\n一起來看看這款三角飯糰蛋糕吧\n∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝ ∝\n📍 搭啵S手作甜點\n🚗地址：高雄市新興區大同一路22號\n⏱營業時間：10:00-18:00\n☎️電話：0981-799-506\n🏖️店休：星期日\n🍓關注麥克，肚子不餓🍓\n#高雄美食 #高雄甜點 #高雄下午茶 #高雄小吃 #御飯糰 #巧克力 #平價美食 #台灣美食 #新興區美食 #高雄景點","username":"","tags":[],"cities":["高雄市"],"shortcode":"C5cux08Pi7R","address_city":"高雄市","other_cities":["高雄市"]},{"id":419,"url":"https://www.instagram.com/reel/C5H21TsJH0b/","type":"Reel","city":"高雄市","category":"其他","caption":"低調‼️開心果口味酥皮泡芙\n\n蜂蜜香草卡士達酥皮泡芙一顆只要$65🤩\n表層特別刨上鹹蛋黃\n飽滿香滑的卡士達內餡帶有蜂蜜香氣\n看到香草籽的用量不禁讓我們讚嘆！\n\n竟然還有開心果口味$80\n一聞就知道這下了重本！濃爆～\n外層是灑上抹茶粉再擠上開心果醬\n內餡的開心果味保證不會讓你失望\n\n外帶是盒裝哦👍\n\n_\n\n📍Raw Stone\n高雄市苓雅區林南街8號\n12:00-19:00（週一公休）","username":"","tags":[],"cities":["高雄市"],"shortcode":"C5H21TsJH0b","address_city":"高雄市","other_cities":["高雄市 高雄市","category":"美食","caption":"-高雄-🍴食扒穗·三民店🍴\n🌟大份量好吃炒泡麵「食扒穗」，現在三民區也吃得到了耶😍，這裡的炒泡麵基本份量都是放2包，吃完真的非常有飽足感！也有賣平價的丼飯、麻辣燙，店裡還提供免費冰蜜茶唷😋\n\n🔺黃金起司炒泡麵 $109\n🌟起司控必吃「黃金起司炒泡麵」，用起司醬、起司片、牛奶做成味道超濃郁的起司醬🧀，可以自選牛肉或豬肉，配上份量滿滿的2包炒泡麵，整個大滿足🥰\n\n🔺日式大阪炒泡麵 $109\n🌟「日式大阪炒泡麵」一樣用了2包泡麵、份量十足！會淋上美乃滋、醬汁，灑上柴魚片和海苔，吃起來有大阪燒的風味，可以選擇牛肉或豬肉，還會附上一顆荷包蛋喔🍳\n\n🔺炙燒肉量升級三倍·牛五花醬飯 $199\n🌟無肉不歡的朋友，點這碗「炙燒肉量升級三倍·牛五花醬飯」就對了！用了三倍份量的牛五花🥩，大火炙燒後逼出香氣，配上一顆溏心蛋還有新鮮時蔬跟超好吃的泡菜👍🏻\n\n🔺經典麻辣燙；招牌乾拌\n🌟這裡的「經典麻辣燙」我也很喜歡，食材選擇非常多種，肉類、蔬菜、火鍋料、麵類等，通通都有，而且價格很平價，辣度也可以自己調整，做成招牌乾拌口味也OK喔👌🏻\n\nP.s 招牌的麻辣鴨血&麻辣豆腐也不錯，也可以點麻辣綜合，一份$35(二份折10元)！\n\n☑️高雄市三民區義華路432號\n☑️電話：07-3955099\n☑️營業時間：10:30-23:00(最後點餐時間22:30)\n\n©️圖文、影片版權皆為「Mandy’s 美食筆記」所有，未經許可請勿轉載使用⚠️\n\n#Taiwan #Kaohsiung #kaohsiungfood #高雄 #高雄美食 #高雄炒泡麵 #高雄宵夜 #高雄小吃 #高雄丼飯 #高雄滷味 #高雄麻辣燙 #三民區 #三民美食 #三民區美食 #高雄新店 #高雄新開幕 #高雄午餐 #高雄晚餐 #高雄必吃 #丼飯 #滷味 #麻辣燙 #炒泡麵 #食扒穗 #食扒穗三民店","username":"","tags":[],"cities":["高雄市"],"shortcode":"C52TryvhTIl","address_city":"高雄市","other_cities":["高雄市"]},{"id":427,"url":"https://www.instagram.com/reel/C53OgeGyzUE/","type":"Reel","city":"高雄市","category":"美食","caption":"7:00賣到23:00的豬舌冬粉～\n\n位在九如路上的冬粉老店\n豬舌是切成比較小塊的 口感不錯\n\n最近天氣比較熱\n不想喝熱湯的可以點乾冬粉\n骨仔肉切盤推薦 蠻好吃的😋\n\n💬內用有冷氣\n\n📍#豬舌冬粉 \n高雄市三民區九如二路270號\n7:00-23:00 （週二公休）\n\n#小吃大口袋\n#三民大口袋\n#高雄美食 #高雄小吃 #高雄早餐 #三民區美食 #高雄冬粉 #豬舌 #高雄晚餐 #高雄宵夜","username":"","tags":[],"cities":["高雄市"],"shortcode":"C53OgeGyzUE","address_city":"高雄市","other_cities":["高雄市"]},{"id":428,"url":"https://www.instagram.com/p/C52SZ5JyuXD/","type":"Post","city":"高雄市","category":"美食","caption":"⠀⠀⠀⠀⠀⠀⠀\n🔺高雄—黃家蜂蜜滷味\n#佩吃高雄 #高雄美食 \n在高雄隱藏的寶藏滷味店！\n你們也趕快來大吃一口吧～～◔.̮◔✧\n\n滷味15元起～滷味品項多達50種\n他們家滷味滷汁中加蜂蜜\n吃起來甜甜的 而且很入味！\n灑上鹹香的胡椒粉 很涮嘴～\n\n⭐️必點滷大腸、豬皮、豆皮、豆乾、高麗菜、櫛瓜、玉米筍、香菇、高麗菜、米血、滷味麵⭐️\n大推一定要加麻辣醬 超加分！\n\n還有每日限量的甘蔗雞\n雞腿肉大隻又肥美\n肉質軟嫩雞皮很香～\n\n🚷週六日公休日\n☎️0983-010691\n⏰16:30～20:00\n📍高雄市三民區自由一路8號\n\n#高雄 #高雄美食地圖 #高雄美食推薦 #三民美食 #三民區美食 #銅板美食 #排隊美食 #高雄下午茶 #高雄必吃 #高雄晚餐 #高雄小吃 #滷味 #高雄旅遊 #台灣美食 #小吃 #晚餐 #kaohsiungfood","username":"","tags":[],"cities":["高雄市"],"shortcode":"C52SZ5JyuXD","address_city":"高雄市","other_cities":[" :"高雄市","category":"美食","caption":"#kaohsiung #高雄 #飢餓小唐 \nㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ\n林森路上的質感火鍋店「飢餓小唐」 @hungry_tango \n有超Q的可達鴨奶凍鍋跟必吃麻辣鴛鴦鍋\n單人鍋加價49元牛肉燥飯、冰品、飲品\n吃到飽，二樓還有半開放及獨立包廂\n約會、聚餐、圍爐都很適合\n重點是這家是親子友善餐廳\n小朋友來用餐老闆還會送一份小禮物！\n\n鴛鴦鍋鍋底 $180/人\n(雙嬌胡椒豬肚雞、川渝麻辣）\n雙嬌胡椒豬肚雞以豬大骨、老母雞等食材熬煮\n特別加入花膠喝起來更加濃稠，白胡椒及青花椒\n讓湯頭帶有清香的香味及微微的辣勁\n川渝麻辣加入大紅袍花椒、漢源青花椒及多種香料\n湯頭麻辣中帶有中藥香氣\n涮肉非常的香而且豆腐鴨血免費續加👍🏻\n\n焦糖檸檬松阪豬 $480、藤椒酥炸雞翅 $320\n火鍋煮熟前先吃經典特色菜厚厚的松阪豬\n鮮嫩脆口表層炙燒後的焦糖香氣搭配\n檸檬片酸甜涮嘴不油膩\n雞翅加入藤椒與花椒醃製油炸時激發香味\n口感鮮嫩多汁麻香夠味！\n\n小唐頂級三拼牛 $899、霸王牛肉 $168\n牛肉控必點的豪華牛肉拼盤，有安格斯熟成肋眼\n低脂牛、翼板牛，現切肉片涮起來肉質鮮嫩\n吃起來很過癮愛吃辣的朋友\n推薦霸王牛肉，醃製過後肉質更加軟嫩\n牛肉上滿滿辣椒涮一下就香辣夠勁！\n\n彩蔬寶盒 $218\n整個很華麗的寶盒讓蔬菜顏值很加分💯\n蔬菜種類豐富又新鮮，份量也很充足\n加在胡椒豬肚雞鍋煮湯頭更加鮮甜！\n\n牛筋 $188、牛肚 $188、老油條 $68\n麻辣鍋必點三寶，牛筋Q彈嫩滑，牛肚大塊又夠味\n吃起來彈牙有嚼勁，老油條涮一下麻辣鍋的湯\n吸飽湯汁後香辣脆口會爆汁！\n\n玉筍鑲蝦滑(6 個) $138、百花鑲蛤蜊(6 顆) $238\n新品登場玉筍鑲蝦滑，玉米筍中夾蝦滑\n口感爽脆又Q彈，百花鑲蛤蜊\n蛤蜊鑲入滿滿的蝦滑，吃起來鮮美Q彈👍🏻\n\n搖搖小鴨 $168、雪山豆腐奶（2顆）$118\n爆紅的小鴨一定要點一隻來搖擺一下！\n萌萌可愛的可達鴨，口感綿密帶有淡淡奶香\n外層酥皮金黃酥脆灑上滿滿的糖粉\n裡面有香甜的奶酪及起司片奶香濃郁鹹甜不膩口！\n\n飢餓小唐經典火鍋 Hungry Tango\n高雄市新興區林森一路227號\n11:30-14:00；17:30-00:30（週一至週五）\n11:30-00:30（週六日及國定假日）\n07 238 5555\nㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ\n#taiwan #taiwanfood #kaohsiungfood #高雄美食 #高雄美食推薦 #高雄美食地圖 #高雄必吃 #高雄一日遊 #高雄景點 #高雄晚餐 #六合夜市 #高雄餐廳 #高雄火鍋 #高雄火鍋推薦 #高雄必吃美食 #新興區 #新興區美食 #新興美食 #新興 #高雄晚餐 #高雄宵夜 #宵夜 #高雄市 #高雄一日遊 #奶酪","username":"","tags":[],"cities":["高雄市"],"shortcode":"C5VURf1Op8N","address_city":"高雄市","other_cities":["高雄市"]},{"id":442,"url":"https://www.instagram.com/reel/C5KhwiyLDHB/","type":"Reel","city":"高雄市","category":"美食","caption":"到底是什麼烤饅頭\n可以讓五月天阿信\n在深夜po限動大推\n我真的好奇到爆炸！！\n\n#高雄 #高雄美食 #高雄小吃 #高雄點心 #高雄探店 #高雄旅遊 #高雄旅行 #高雄甜點 #高雄苓雅區 #苓雅區 #苓雅區美食 #苓雅美食 #烤饅頭 #蒜泥雖小 #五月天阿信 #阿信 #五月天演唱會 #五月天高雄演唱會 #豆比登 #豆比登美食指南","username":"","tags":[],"cities":["高雄市"],"shortcode":"C5KhwiyLDHB"},{"id":443,"url":"https://www.instagram.com/reel/C5F9ruKLpHp/","type":"Reel","city":"高雄市","category":"住宿","caption":"五星級的港式點心全部銅板價！\n有著多年港式飯店經驗的老闆\n全部的餐點都是自己手工製作\n單顆販售大家可以多樣選擇超豐盛\n\n✅招牌蝦仁燒賣$22✅小蝦仁燒賣$14\n✅鮮肉燒賣$13✅糯米珍珠丸$13\n真的非常好吃！紮實程度一吃就知道水準\n大顆的蝦仁燒賣蝦肉好有彈性，珍珠丸的糯米飽滿肉餡也超新鮮\n\n✅黃金流沙包$17✅芝麻流沙包 ":465,"url":"https://www.instagram.com/reel/C2wq9NfSJQj/","type":"Reel","city":"高雄市","category":"美食","caption":"［#高雄三民］#錨屋\n\n是家質感壽喜燒店～\n親訪終於懂為什麼網友會說是被壽喜燒耽誤的甜點店😂\n飲品跟甜點真的出乎意料的優質！！\n壽喜燒口味也在水準上(上)\n最讓人意外的是蝦蝦上桌前已經去了殼😱\n這不是另一半專屬工作嗎？！😂\n生日訪還有壽星專屬的冰淇淋可麗餅、生巧克、提袋以及拍立得一張\n非常用心地在祝福壽星😌\n\n餐點部份～\n前菜、飲料、甜點（限一份）/人\n肉品、私房料理、沾醬、主食、時蔬（無限享用）\n\n$599/人 加一成服務費\n兒童90公分以下免費，90-130公分$299\n\n#壽喜燒 #甜點 #飲料 #吃到飽 #生日禮 #高雄美食 #三民美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"C2wq9NfSJQj"},{"id":466,"url":"https://www.instagram.com/reel/C4XWN9Zr2iM/","type":"Reel","city":"桃園市","category":"美食","caption":"這家早午餐份量很有誠意\n果真如他牆上寫的\n一分錢一份貨\n吃過變吃貨\n\n總匯厚爆\n乳酪絲、荷包蛋、雪花牛、番茄、 生菜、玉米\n花生醬的味道很不錯\n是有顆粒的那種\n\n蛋餅也是異常大捲\n看煎蛋餅的人\n高麗菜絲拼命塞\n鮪魚拼命倒\n肯定能吃飽\n\n宇治抹茶丹麥吐司是抹茶控堅持要點的\n搭配丹麥吐司口感更香\n還有灑上乳酪絲的小巧思\n\n洋蔥圈、雞翅跟薯餅\n也都表現優秀\n\n飲料還有芒果口味的手搖飲可以選\n看裝潢跟菜單上的打拋豬三明治\n我懷疑老闆是不是原本想要開泰式餐廳\n\n這間老闆手藝很好\n東西有用心在做\n值得推推\n\n美式雪花牛肉總匯 $139\n宇治抹茶丹麥吐司 $55\n芥末鮪魚蛋餅 $69\n洋蔥圈圈 $75\n紐澳良雞翅 $85\n麥肯薯餅 $25\n當日果汁 $40\n芒果玉露青茶 $55\n無糖高纖豆漿 $30\n\n————————\n柚麥巷早午餐\n🧭: 桃園市桃園區介壽路521號\n⏳: 06:00–13:30\n⌛️: 週二周三公休\n🕊: 03 218 0356\n————————\n#食在好玩桃園 #柚麥巷早午餐 #桃園 #桃園美食 #桃園美食推薦 #桃園必吃 #桃園早餐 #桃園午餐 #桃園早午餐 #八德美食","username":"","tags":[],"cities":["桃園市"],"shortcode":"C4XWN9Zr2iM","address_city":"桃園市","other_cities":["桃園市"]},{"id":467,"url":"https://www.instagram.com/reel/C4QMSoaPCNp/","type":"Reel","city":"桃園市","category":"美食","caption":"來分享桃園#新開幕麵匡匡啦\n店內座位數量不多卻也不擁擠\n冷冷的天都會很想吃拉麵耶，誰也是這樣🤣\n\n這次點了麻辣、豚骨兩種口味✨\n店家主打:鹹淡適中的湯頭，喝起來清爽不膩口\n牛肉和叉燒都可以吃到淡淡炙燒的香氣\n唐揚炸雞🍗\n剛炸起來外酥內嫩，一口咬下真的超級多汁！\n絕對是必點的招牌菜色👍🏻\n\n趕快來碗拉麵療癒自己吧(´▽｀)\n這裡的豚骨湯可以免費續（CP值蠻高的）\n不喜歡重油重口味的人 這間很適合♡\n\n- - - - - - - - - - - - - - - - - -\n🏠麵匡匡拉麵食堂\n📍桃園市八德區義勇街26號\n⏱11:00-14:30 \n  17:00-20:30\n\n#桃園美食 #桃園拉麵 #桃園餐廳 #桃園必吃\n#八德拉麵 #貝拉eat桃園 #推薦 #八德美食","username":"","tags":[],"cities":["桃園市"],"shortcode":"C4QMSoaPCNp","address_city":"桃園市","other_cities":["桃園市"]},{"id":468,"url":"https://www.instagram.com/reel/C2wi2RYvgX_/","type":"Reel","city":"桃園市","category":"美食","caption":"想讓我分享哪個縣市的銅板美食\n或是你們推薦的歡迎留言告訴我\n這次是搜集哀居多人推薦的美食\n\n🏠香港煎包 🌟🌟🌟🌟🌟\n大推去買建議提早去買或電話預訂\n離桃園高鐵不遠～\n吃過最特別的煎包只有這裡吃得到\n別的地方不會有😉\n\n很特別一定要趁熱現吃\n表皮炸得金黃酥脆不油膩 \n餡料炸多很juice👍\n醬料還可以自己打包隨便加\n越吃越好吃建議不要只買一個會後悔\n\n🏠波哥泡芙🌕🌕🌕🌕🌗\nCp值很高外皮微酥內餡爆漿\n每個禮拜都有不同的限定口味\n我吃奶皇的有嚇到和以往吃的不同\n我覺得這家做的好好不會很鹹很膩\n但整體泡芙再更酥會更讚\n\n🏠三角店客家菜粿🌕🌕🌕🌕🌗\n第一次看到有這麼多種口味的粿\n而且還有分大小葷素很友善\n一顆小小的很便宜而且還可以嚐試各種口味\n\n🏠張豐盛商行🌟🌟🌟🌟🌟\n看好久的霜淇淋🍦\n每個人都是來買冰哈哈\n我點綜合芝麻牛奶口味\n好順口不會很甜欸而且香氣濃郁\n一隻80好划算還有附糖餅\n\n🏠驚嘆號臭豆腐🌕🌕🌕🌕🌖\n超有名的我以為只是普通臭豆腐而已\n所以一開始沒有保持太高期待\n結果咬下去嗯！真的好吃欸\n而且好酥跟餅乾一樣☺️\n豆腐裡面很嫩有水份\n\n一天吃爆5家在地美食這些\n都很推薦你們去吃！🈚️雷\n證明桃園不是美食沙漠\n還是有隱藏版美食尤其是大推煎包\n\n2024/1/17食.\n\n#桃園 #桃園甜點 #桃園下午茶 \n#桃園美食推薦 #桃園美食 #中壢美食\n#中壢 #中壢下午茶 #台灣 #台灣美食\n#美食推薦 #美食日記 #美食攝影 #美食\n#銅板美食 #在地美食 #排隊美食 #人氣美食 \n#臭豆腐 #驚嘆號臭豆腐 #香港煎包 #波哥泡芙","username":"","tags":[],"cities":["桃園市"],"shortcode":"C2wi2RYvgX_"},{"id":469,"url":"https://www.instagram.com/reel/C3cxW8LP-_N/","type":"Reel","city":"高雄市","category":"美食","caption":"［#黃鵲食料研製所］\n-\n大家可能看過他們家的豚肉燒\n但不曉得他們家的拉麵也是很好吃的吧？\n-\n#赤拳豚肉燒風味餐 💰200 /+起司20\n#魚介味噌 手打麵 💰250\n赤拳豚肉是以番茄作為醬底去烹煮\n老闆娘會告訴我們風味最佳的烹煮辦法和時間\n照做就對了啦！煮的軟嫩又入味 配飯很香～\n魚介這款是店裡最鹹最濃郁\n但也不是死鹹的那種（但也不太適合單喝湯）\n油脂香氣很香 濃郁湯汁緊扒著麵條一起入口\n還有軟嫩的叉燒和雞胸肉片 還有解膩的蔥、洋蔥和筍乾\n過癮的> <\n很推薦和朋友一起來點一個風味餐+拉麵分著享用\n是一間從闆娘對於餐點的堅持和實際享用的味道上都很能感受到職人精神ㄟ 餐館 推推！\n-\n🔺Google評分：4.5/1174則評論\n-\n美味程度：🐥🐥🐥🐥\n服務態度：很用心\n再訪意願：🐥🐥🐥🐥\n(滿分五隻🐥/🐣0.5分/🐤0.8分\n-\n地址🏠高雄鳳山區濱山街15巷1號\n營業時間🕑11:00-14:00、17:00-21:00|公休詳見官網\n_\n🚩縣市分類 #高雄美食 #家雞高雄吃\n🚩區域分類 #鳳山美食 #家雞鳳山吃\n-\n#家雞的食記 #kaohsiung #kaohsiungfood #高雄正餐#高雄聚餐#日式料理 #長庚美食 #正修科技大學 #travelinKaohsiung #taiwan","username":"","tags":[],"cities":["高雄市"],"shortcode":"C3cxW8LP-_N"},{"id":470,"url":"https://www.instagram.com/reel/C1jYmvkrLVR/","type":"Reel","city":"高雄市","category":"美食","caption":"｜高雄小吃 5家｜2024年第一篇文！祝大家新年快樂🎊\n-\n①老巷子 重慶特色小吃\n回訪許多次的店！他們家的重慶小麵真的好吃！\n四川姐妹經營的店！辣度都可以做調整！\n🏠高雄市左營區新中街120號\n⏰11:00～20:30（週日公休）有臨時公休可至臉書粉專看\n☎️ 0907 717 100\n②午安波波\n碳烤甜甜圈！口味有鹹有甜！超適合當點心！\n🏠高雄市三民區莊敬路217號\n⏰11:30～18:00（週六公休） 可能會臨時公休，可打電話確認\n☎️ 0900 333 776\n③YuRay廚坊/潤餅皮蛋餅\n用潤餅皮製作的蛋餅！口味很多超難抉擇！香菜芋頭肉鬆口味很好吃❤️‍🔥\n外皮超酥脆！\n🏠高雄市鹽埕區大安街164號\n⏰7:30～12:30\n☎️ 07 561 7288\n④鄭家粉圓\n 市苓雅區大順三路66號\n（輕軌搭到聖功醫院站走路3分鐘可到）\n⏰17:00～00:00\n☎️0906-236-256\n————————————————————\n#蔥鹽五花豬小拼盤 適合一個人獨享😍\n有這盤有蔥鹽五花豬+任選三種烤物\n（椒鹽黑輪+烤魚包蛋+切片香腸）\n五花豬蠻Q的搭配自製蔥鹽醬很夠味\n黑輪很推！外酥內嫩\n\n#全部都有綜合大拼盤 \n這超大盤又超漂亮好好拍🙈\n超適合跟一群朋友共享配酒超讚\n這盤有椒鹽雞腿排+椒鹽黑輪+醬燒米血+酥烤豆皮\n蔥鹽五花豬+鯛魚下巴+切片香腸+烤糯米腸\n\n我還是第一次看到燒烤拼盤看起來這麼美又好吃\n每樣烤物都是現點現做 \n拼盤還有搭配十多種蔬食 \n一個人也可以吃的很豐盛\n\n我自己非常喜歡他們拼盤有的烤蔬菜\n有十多種時蔬 沒有過多調味就能吃到蔬菜的鮮甜\n也算是他們家的一大特色💕\n還有很特別的#炙燒焦糖烤柳丁 酥脆的糖衣搭配酸甜的柳丁\n留在最後吃很解膩😍 \n烤香蕉也是好吃 喜歡水果拿來烤 \n\n#焗烤馬鈴薯 牽絲的起司配上綿密的馬鈴薯很可以😍\n#綜合烤飯糰 超可愛！可以一次吃到五種不同口味的飯糰\n味道不錯 可以跟老闆說烤酥一點會更好吃\n\n#腳落香料烤全雞\n醃製過的香料烤雞 味道不會到非常重\n搭配特製椒鹽粉 好吃不油膩\n\n店裡環境蠻舒適\n但位置不算到非常多 建議可以先訂位唷\n我蠻喜歡這種燒烤拼盤 還能吃到多種蔬菜\n一個人或多人來都很適合\n有興趣的朋友快收藏起來🙌\n\n🌿組合烤飯糰$100\n🌿焗烤馬鈴薯$100\n🌿蔥鹽五花豬小拼盤$330\n🌿全部都有綜合大拼盤$630\n🌿腳落香料烤全雞 試賣價$750（原價$999）\n👉烤雞要提前一天預訂\n\n#腳落燒烤料理#高雄燒烤#高雄美食#高雄必吃#高雄#苓雅區美食#高雄小吃#高雄聚餐#苓雅區美食#高雄居酒屋#高雄晚餐#高雄宵夜 #kaohsiungfood#kaohsiung#igfood#instafood#foodie#2eat2gether","username":"","tags":[],"cities":["高雄市"],"shortcode":"C3scVvuvQlf","address_city":"高雄市","other_cities":["高雄市"]},{"id":493,"url":"https://www.instagram.com/reel/C1JpOXMv3Qr/","type":"Reel","city":"高雄市","category":"美食","caption":"🎰 去哪裡？吃什麼？不用再煩惱了！\n「點擊分享或收藏，下次找美食更方便」\n\n這次漢斯用拉霸機形式整理的高雄捷運美食\n因為我自己和朋友要吃什麼也都猶豫很久🤣\n有了這個直接螢幕長按，就去這裡吃東西吧！\n\n高雄捷運路網逐漸完善，輕軌也即將在元旦成環\n出門不要再曬太陽、吹寒風找停車位半天了🫢\n幾乎是出站10分鐘內能夠步行到店，\n也都是★4.0以上或是口碑名店呦！\n\n漢斯整理的如果你都吃過了\n也可以看你點到的該車站去附近找美食☺️\n\n（🗣️：裡面一定有不是你喜歡的口味或店家，但希望大家可以理性討論，分享你的美食給我❤️）\n———\n#高雄美食 #高雄必吃 #美食地圖\n#捷運美食 #高雄餐廳 #高雄咖啡廳\n#高雄推薦 #高雄景點 #美食推薦 \n#平價美食 #左營美食 #巨蛋美食 #高雄 \n#鹽埕美食 #高雄甜點 #高雄下午茶 #美食日記","username":"","tags":[],"cities":["高雄市"],"shortcode":"C1JpOXMv3Qr"},{"id":494,"url":"https://www.instagram.com/p/C3nFFeGP45h/","type":"Post","city":"高雄市","category":"美食","caption":"👇🏻 高雄-鳳山 👇🏻(🔊影片-開聲音🔊)\n☀️ 姥三寶-鳳山五甲店 ☀️\n－－－－－－－－\nSの不專業食評👇🏻\n是什麼店 營業時間還沒到就有人在門口等✨ 這家姥三寶位於鳳山五甲 主要有乾鍋、麻辣燙 店內蔬菜每樣約$20 肉類$30 一包包分裝好 排列整齊、選擇豐富 看起來就很舒服😍\n-\n#辣乾鍋 以麻辣湯為基底川燙 再撒上店家自製辣料(含花生粒)、花生粉、香菜蔥花 不得不說花生粉配香菜 讓人為之瘋狂😚  也很下飯🤤 \n我點👇🏻\n$20高麗菜、大豆皮、意麵、魚豆腐、豆包\n$30娃娃菜\n$35肥腸\n-\n#麻辣燙 我點微辣 是龍骨湯搭配麻辣湯調製的辣度 他們家的辣挺有感 加一點點就滿夠味的 這湯頭配任何料都好吃 麻辣鴨血、豆腐必點 老油條 炒河粉口感Q彈，融入醬汁的香氣、越吃越唰嘴；裡面還有好吃的炒蛋，一樣吸收了滿滿的醬香～\n\n🔺水門海南雞香米飯 $130\n🌟雞肉Q彈又鮮嫩的「水門海南雞香米飯」，淋上香噴噴的醬汁，讓人食慾大開🤤，清爽的涼拌風味，吃起來非常開胃；價格平易近人，擺盤也很用心💕\n\n🔺冬蔭酸辣蝦湯 $160\n「冬蔭酸辣蝦湯」一份吃到六隻蝦🦐，酸酸的鹹香滋味，就是經典的冬蔭湯頭，裡面還放了鴻禧菇，還有蕃茄與檸檬提味！\n\n🔺玫瑰荔枝冰茶 $70；劈腿二奶雙享杯 $100\n🌟「玫瑰荔枝冰茶」玫瑰與荔枝的香氣融合在一起，喝起來香甜又清爽；「劈腿二奶雙享杯」一次可以喝到泰式奶茶+泰式奶綠，雙重享受💕\n\n🏷️泰杜左營店\n☑️高雄市左營區立大路308號\n☑️電話：07-3503068\n☑️營業時間：11:00-20:30\n\n🏷️泰杜鹽埕店\n☑️高雄市鹽埕區北斗街18號\n☑️電話：07-5213268\n☑️營業時間：11:00-20:30(週四公休)\n\n©️圖文、影片版權皆為「Mandy’s 美食筆記」所有，未經許可請勿轉載使用⚠️\n\n#Taiwan #Kaohsiung #kaohsiungfood #高雄 #高雄美食 #高雄泰式 #高雄泰式料理 #高雄餐廳 #高雄聚餐 #高雄泰奶 #高雄午餐 #高雄晚餐 #高雄必吃 #高雄河粉 #高雄咖哩 #高雄外帶 #高雄新店 #高雄新開幕 #左營美食 #左營區美食 #鹽埕美食 #鹽埕區美食 #泰國菜 #泰式料理 #泰式餐廳 #河粉 #泰杜咖哩","username":"","tags":[],"cities":["高雄市"],"shortcode":"C3WqZqrvUxD","address_city":"高雄市","other_cities":["高雄市"]},{"id":497,"url":"https://www.instagram.com/reel/C2J6CbNr0kN/","type":"Reel","city":"高雄市","category":"美食","caption":"高雄吉林夜市6家美食推薦\n-\n吉林夜市規模雖然不大，可是短短一條街匯聚了多家美食小吃，這次來分享6家：\n1）金典燒烤\n📍高雄市十全路吉林街交叉路口\n🈺17:00–23:30\n休：休一四\n\n2）吉林蒸餃\n📍高雄市三民區吉林街134號\n🈺17:00–00:30\n\n3）許香香老牌八寶冰專賣店\n📍高雄市三民區吉林街167號\n🈺11:30–23:30\n\n4）柒菓煎餅果菓子\n📍高雄市三民區吉林街150號\n🈺17:00–23:30\n\n5）廖家小妹烤黑輪關東煮\n📍高雄市三民區吉林街151號\n🈺14:00–00:00\n\n6）可以可以地瓜球\n📍高雄市三民區吉林街169號\n🈺16:00–23:00\n休：週一\n-\n📬大家有推薦其他的吉林夜市美食，歡迎留言分享!😊\n-\n#fy吃東西 #fy食記懶人包 #吉林夜市#高雄美食#高雄小吃#三民區美食#銅板美食#高雄旅行#food #foodie #taiwantravel #foodphotography #kaohsiung  #foodvideo  #kaohsiungfood #foodlover  #yum #foodpornshare","username":"","tags":[],"cities":["高雄市"],"shortcode":"C2J6CbNr0kN","address_city":"高雄市","other_cities":["高雄市"]},{"id":498,"url":"https://www.instagram.com/reel/C3m7DuiPnHL/","type":"Reel","city":"高雄市","category":"住宿","caption":"高雄超方便的住宿 大家請收藏！\n而且房型全部都是高樓層房～\n視野超讚😍😍\n\n上次從武陵賞櫻直奔高雄後（真的超累...）\n我們入住和逸飯店•高雄中山館\n重點還可以免費停車 超加分！\n\n每間房型都是23樓以上的高樓層\n視野非常好～\n我們住的房間還可以直接看到85大樓\n大浴缸泡澡也超享受\n我尤其喜歡房間內的小沙發\n還有辦公桌可以用電腦\n休息或是辦公都很舒適\n\n樓下就是捷運站\n附近還有大遠百、新光三越等\n逛街吃飯都超方便\n懶得出門也可以到飯店的高空餐廳用餐\n半自助式 CP值滿高\n夜晚港邊景色超浪漫\n\n早餐自助吧選擇超多\n還有現燙牛肉湯！\n\n喜歡先收藏起來\n下次到高雄玩才不會忘記🫶\n------------\n🔍#麻煩快去住😆 #麻糬住高雄 #麻糬玩高雄\n----------- 美的一道\n\n🌟港式必點的三道點心\n蘿蔔糕是可以吃到整塊蘿蔔的，不浮誇口感超好\n流沙包裡面包的除了奶油還有鹹鴨蛋（並列Top1）\n燒賣裡面包著蝦仁、腿肉，一入口就超級香\n\n飲料的部分也都是港式的凍檸系列，配著飯吃很唰嘴🥤\n\n愛吃港式的我大力推薦這間！價錢親民重點是餐點都很美味又特別\n加上老闆超級親切也很熱愛聊天😆\n也是我心中屌店的前幾名之一💯\n\n🟣大佬海龍王蛋炒飯$159\n🟣豬扒蛋香炒飯$179\n🟣避風塘嫩牛麵$169\n🟣豬扒聯盟蛋麵$169\n🟣黃海流沙包$88 🟣大佬燒賣$85\n🟣化骨綿掌蘿蔔糕$79\n🟣大佬凍檸七$60\n🟣鴛鴦咖$70\n\n—————————————\n🟪餐廳名稱：港式大佬\n🟪餐廳地址：高雄市苓雅區苓雅一路299號\n🟪營業時間：12:00-15:30、16:30-20:00 週三固定公休\n\n#hsiaoyoseat #跟著Hsiaoyoseat屌店很容易 #高雄美食 #高雄港式料理 #港式料理 #高雄炒飯 #高雄公仔麵 #蘿蔔糕 #燒賣 #Kaohsiung #Kaohsiungfood #高雄午餐 #高雄晚餐","username":"","tags":[],"cities":["高雄市"],"shortcode":"C3kqBGqPPU6","address_city":"高雄市","other_cities":["高雄市"]},{"id":506,"url":"https://www.instagram.com/p/C3h8E32PY1N/","type":"Post","city":"高雄市","category":"美食","caption":"👇🏻 高雄-左營 👇🏻(🔊影片-開聲音🔊)\n☀️ 梅花糕 ☀️\n－－－－－－－－\n🌵芋泥🌕🌕🌕🌗$50\n🌵地瓜🌕🌕🌕🌗$50\n－－－－－－－－\nSの不專業食評👇🏻\n近期爆紅的梅花糕 高雄也吃的到✨ 配料豐富 麵皮帶有古早味香氣 填上餡料 撒上切片紅棗、小湯圓、芝麻 就像是很多料的紅豆餅(? 餡料很濃很滑順~ 整體還滿好吃的😋 一份看起來小小的 但挺有份量 一個不小心會翻倒(我有翻倒😆) 我們選芋泥跟地瓜 兩種都好吃 但我喜歡芋泥更多 只是不怎麼平價 可以嘗鮮試試囉😊\n-\n🏠 瑞豐夜市 第三排\n-\n以上圖文、影片為「Sally_lin0616」所有，未經授權請勿任意轉載。All Rights Reserved © \n－－－－－－－－\n#高雄 #梅花糕 #瑞豐夜市 #左營美食  #左營小吃 #sally吃左營 #sally吃甜甜 #瑞豐夜市美食 #高雄美食 #高雄小吃 #食記 #想吃就跟我走👣 #sally吃三餐 #Sally吃高雄 #Kaohsiung","username":"","tags":[],"cities":["高雄市"],"shortcode":"C3h8E32PY1N"},{"id":507,"url":"https://www.instagram.com/reel/C2KfUz6PWgx/","type":"Reel","city":"高雄市","category":"住宿","caption":"高雄新開幕唯一海景民宿🌊\n\n有一次在客廳播放著海水浪花拍打的聲音\n一個不小心居然就睡著了！\n這是我難得的不小心睡著🤣\n從那次之後\n一直想來場真正的聽著海聲入睡的夜晚✨\n沒想到能在高雄實現這個小小心願\n內心的浪漫情懷直接爆棚♡ᵕ̈\n\n獨立一棟的民宿\n一天只接一組客人\n很適合給來家族旅遊或是一群朋友聚會\n一定會非常喜歡這裡的氛圍感\n位置就在西子灣的山上\n（中山大學再往上15-20分鐘左右的車程）\n而且旁邊還有咖啡廳可以覓食\n旁邊有山景的地方好像也可以往下探險（？\n看到有人走下去岩石那裡~\n\n除了電器產品齊全\n民宿還有準備好多包的泡麵\n跟一些小餅乾 \n冰箱也有一些鋁箔包跟汽水\n覺得還蠻貼心的！\n這邊鍋具也很齊全\n非常推薦大家採買食物晚上回來民宿一起料理\n印象中還有洗碗機👍🏻\n就不用推託誰來洗碗了（喂🤣\n\n🔎凝海辰居 @ninghi202309 \n📍高雄市鼓山區柴山路103-2號\n🏷️平日$9800/晚\n🏷️假日$12800/晚\n（6-7人；$1400-$1800/人）","username":"","tags":[],"cities":["高雄市"],"shortcode":"C2KfUz6PWgx","address_city":"高雄市","other_cities":["高雄市"]},{"id":508,"url":"https://www.instagram.com/p/C3XgrrVvCvO/","type":"Post","city":"高雄市","category":"住宿","caption":"📍高雄\n古老與現代的完美融合✨\n整體走日式文青風\n整間民宿寬敞明亮又舒適😌\n一踏進還有木頭香香的味道😍🪵\n-\n【塩晨．宿】\n✅地址：高雄市鹽埕區大公路29號\n✅電話： 07-5319228\n📸 Booking.com\n-\n👇🏻加入keke大家庭👇🏻\nKeke 帶我去旅行 @keke_traveltheworld\nKeke 吃貨日記 @keke_foodietw\nKeke 生活日記 @keke.lifediary\n-\n#keke住宿趣 #keke去高雄 #高雄打卡 #高雄住宿 #高雄必住 #高雄 #打卡住宿 #住宿 #渡假 #塩晨宿","username":"","tags":[],"cities":["高雄市"],"shortcode":"C3XgrrVvCvO","address_city":"高雄市","other_cities":["高雄市"]},{"id":509,"url":"https://www.instagram.com/p/C3g9kz9vR8R/","type":"Post","city":"高雄市","category":"美食","caption":"-高雄-🍴星鑫茶餐廳🍴\n🌟高雄我心中五顆星的港式料理「星鑫茶餐廳」😍，超愛吃港式的我跟小蔡都愛到不行！！這裡的口味真的有厲害、份量也很有誠意👍🏻，連鹹檸七都放了整顆的鹹檸檬；愛吃港式的朋友們，趕快衝了啦💯💯\n\n🔺麻辣豬肉煲180\n🌟份量誠意滿滿的「麻辣豬肉煲」，麻辣湯頭喝起來非常過癮🌶️，吃得到豬肉片、鴨血、豆腐、魚蛋、豆皮、金針菇、高麗菜等，主食我搭配了公仔麵🍜，竟然還有附一碗白飯，絕對吃得飽飽飽！\n（湯底可選擇：經典麻辣、椒香麻辣、麻辣牛奶）\n\n🔺香菇滑雞蒸飯 $120\n🌟我超愛的「香菇滑雞蒸飯」，雞肉真的有夠嫩、好好吃😋，香菇一咬下去還會爆汁！底下的白飯吸收了醬汁滿滿的香氣，稍微攪拌後就非常入味唷～\n\n🔺乾炒河粉 $160\n🌟鍋氣十足的「乾炒河粉」，可選則牛肉或豬肉！師傅的炒功很厲害，把河粉炒到熱氣騰騰又保有彈性，牛肉也超嫩、超好吃🥩，喜歡吃炒河粉的朋友們必點哦！\n\n🔺臘味蘿蔔糕 $65；南乳炸雞翅 $90\n🌟我個人超愛「臘味蘿蔔糕」，煎到外皮香酥，一咬下去幾乎入口即化，綿密的蘿蔔香超讚！「南乳炸雞翅」外皮酥脆、肉質鮮嫩，吃完還讓人允指回味🥰\n\n🔺白玉珍珠丸 $90/3粒；蒜蓉蒸絲瓜 $85；蒜蓉蒸蛤蜊 $100\n🌟蒸籠小點心我們一致認同「白玉珍珠丸」大顆又好吃！蒜蓉系列也超香，我自己嗑完了一份「蒜蓉蒸絲瓜」🤣，「蒜蓉蒸蛤蜊」多了蛤蜊味道更提鮮～\n\n🔺凍檸茶 $55；鹹檸七 $55\n🌟「凍檸茶」就是冰的檸檬紅茶，這裡的味道跟我在香港喝到的超級像，而且不會太甜、非常加分；「鹹檸七」是鹹檸檬+七喜，真的放了一整顆的鹹檸檬，一定要把鹹檸檬戳戳戳，讓味道釋放到飲料裡🍋\n\n☑️高雄市三民區熱河一街214號\n☑️電話：0966-382-755\n☑️營業時間：18:00-00:00(週四、週日公休)\n\n©️圖文、影片版權皆為「Mandy’s 美食筆記」所有，未經許可請勿轉載使用⚠️\n\n#Taiwan #Kaohsiung #kaohsiungfood #高雄 #高雄美食 #高雄餐廳 #高雄港式 #高雄港式飲茶 #高雄港式料理 #高雄晚餐 #高雄宵夜 #三民 #三民區 #三民美食 #三民區美食 #熱河街 #熱河街美食 #吉林夜市 #高雄小吃 #高雄必吃 #高雄新店 #高雄新開幕 #高雄外帶 #港式飲茶 #港式料理 #星鑫茶餐廳","username":"","tags":[],"cities":["高雄市"],"shortcode":"C3g9kz9vR8R","address_city":"高雄市","other_cities":["高雄市"]},{"id":510,"url":"https://www.instagram.com/reel/C3c6OJMSqy8/","type":"Reel","city":"高雄市","category":"美食","caption":".\n做自己熱愛的事會發現自己依然如此閃亮\n光沒有滅 只是有時它會想休息一下\n沒事的 休息是為了走更長的路\n於是我現在不就產出新的影片了嗎～\n\n/\n\n看到這片海 感覺我心情都瞬間被療癒了起來\n我的快樂總是如此簡單 只要有美的風景 我就能打起精神\n若感到迷惘 有個能治癒自己的方式真的很重要\n\n在這座柴山上有超多知名的網美咖啡廳\n意外發現我好像把這座山上的咖啡廳都去過了\n唯獨這間我竟然 cities":["高雄市"],"shortcode":"Csdm-cSvO4X"},{"id":525,"url":"https://www.instagram.com/p/CtDqc9frzE1/","type":"Post","city":"高雄市","category":"美食","caption":"駁二＆西子灣吃什麼？不藏私美食攻略😎\n\n假日不知道去哪裡時\n我常常不是在巨蛋就是來駁二🤣\n傍晚再到西子灣看夕陽 完美～\n\n回想起第一次到#駁二 玩的印象\n是2013年黃色小鴨旋風來台！\n居然已經10年了啊～😳\n這幾年的駁二特區也改變許多\n相信大家應該都很有感吧\n\n主要位在鹽埕的駁二特區\n具有相當豐富的歷史文化\n經歷了繁華與沒落後轉型蛻變\n新舊交織對我來說是很迷人的地方\n\n這附近的美食密度超高🤤\n保留許多古早味的傳統小吃\n也有新興的文青甜點咖啡廳\n這次整理出10家給各位🔥\n還有很多以前吃過的店家\n但當時沒有拍照 只能先pass🥴\n____________________________\n\n🙋‍♀️晚晚a美食傳送門\n👉高雄美食🔎 #foodinlovekaohsiung\n👉高雄懶人包🔎 #晚晚a懶人包_高雄\n👉全台懶人包🔎 #晚晚a懶人包\n____________________________\n\n#鹽埕美食 #高雄美食 #高雄甜點\n#高雄午餐 #高雄晚餐 #高雄飲料\n#高雄旅遊 #高雄旅行 #鹽埕區美食\n#西子灣美食 #高雄小吃 #高雄咖啡廳 \n#御典茶 #丸浜霜淇淋 #高雄美食推薦\n#駁二美食 #鴨肉珍 #鴨肉本 #高雄必吃","username":"","tags":[],"cities":["高雄市"],"shortcode":"CtDqc9frzE1"},{"id":526,"url":"https://www.instagram.com/p/C1J9YQOv_Nn/","type":"Post","city":"高雄市","category":"美食","caption":"之前有一陣子很迷戀港式飲茶\n來推薦5家高雄港式餐廳給大家🎉\n\n#京翠港式飲茶\n🚩高雄鼓山區龍德新路222號8F\n高雄萬豪酒店\n環境寬敞氣派、風格新穎\n氣氛不錯～適合約會💕\n\n#好正點港式飲茶 吃到飽\n🚩高雄前鎮區三多三路213號11F\n結合港點與熱炒的高CP值港式\n三多店限定！才有吃到飽✨️\n採單點式點餐 非自助式\n但口味較普通😌\n\n#蒸鮮腸粉港式飲茶\n🚩高雄三民區青年路二段529號\n🚩高雄左營區 #裕誠路 322號\n🚩高雄鼓山區大順一路115號B2\n高雄在地品牌\n連鎖港式餐廳\n竹籃炸鮮奶推推好吃🤤\n\n#品中信茶樓\n🚩高雄前鎮區中華五路789號綠區8F\n經典老牌茶樓\n風格樸實懷舊🥰\n適合帶長輩來一起品味\n炒飯、燒賣推推\n兩人也有小份量可以點唷～\n\n#東悅坊港式飲茶\n🚩高雄前鎮區瑞田街99號9F\n空間大、桌數多\n過年過節家族聚會最適合！\n也有小份量餐點或個人煲湯\n是兩個人也能吃的港式飲茶😋\n______________________________\n\n👉晚晚a高雄美食足跡\n🔎 #foodinlovekaohsiung\n\n👉全台懶人包系列\n🔎 #晚晚a懶人包 \n\n#高雄港式餐廳 #高雄捷運美食 \n#高雄港式 #高雄港式飲茶 #高雄午餐\n#高雄聚餐推薦 #高雄聚餐 #高雄晚餐 \n#鼓山美食 #鼓山區美食 #裕誠路美食\n#前鎮美食 #三民區美食 #左營美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"C1J9YQOv_Nn"},{"id":527,"url":"https://www.instagram.com/p/C1reTzOvB2o/","type":"Post","city":"高雄市","category":"美食","caption":"高雄甜點獵人出沒～10家咖啡廳推薦✨️\n趕快分享給朋友一起吃爆😆\n按❤️+收藏🎉 才不會錯過更多！\n\n#双蒔 Jumelles Pâtisserie\n🚩高雄苓雅區海邊路108號\n高流附近的質感甜點店♡\n\n#望思甜點\n🚩高雄鹽埕區莒光街171號\n鹽埕埔捷運站旁 木質調咖啡廳\n\n#日和珈琲\n🚩高雄左營區新上街307巷2號\n有柴犬店長！\n巨蛋附近的復古咖啡廳\n丹麥吐司、巴斯克、布丁\n\n#屋裏有甜點 \n🚩高雄新興區渤海街153號\n超好拍韓系甜點店～\n招牌必點水果千層蛋糕\n個人更推提拉米蘇😋\n\n#先生sensi\n🚩高雄三民區綏遠一 的三明治、漢堡，也有咖哩和丼飯可以選擇\n\n-\n\n📍伯公潭橋/新光吊橋/糯米橋\n🚗桃園市平鎮區新富橋619號\n⏰24小時\n⚠️沒什麼遮蔭，怕熱不要正中午來⚠️\n\n沿河畔散步或是騎腳踏車都很讚\n這裡晚上點起燈我覺也不錯\n上面地址我是直接幫你們導到youbike站\n（其實從日日朝食騎過來也可以）\n特別想介紹廣仁宮和龍門許願樹\n傳聞跟土地公許完願後鑽樹根形成的洞，願望就會實現\n我苦求四次讓我找到好工作才得到聖杯🥹\n人生好難\n\n-\n\n接下來咖啡廳行程你們可以二選一\n\n飲料100出頭，十幾隻貓咪任你撸的\n📍Faith Cafe | @faith__cafe \n⏰週四～週一｜13:00-21:00\n🚗桃園市平鎮區環南路三段291號\n⚠️唯一小缺點就是難停車⚠️\n\n室內室外都漂亮也好停車的\n📍HoneyWood Cafe| honeywoodcafe.tw \n🚗桃園市平鎮區復旦路四段116巷51號\n⏰ 週一～日｜09:00-20:00\n👉室內低消200\n\n咖啡廳之前介紹過了啦，可以看看之前的貼文\n\n-\n\n📍義興公園臭豆腐\n🚗桃園市平鎮區新興路177巷24弄\n⏰每日｜11:00-18:00\n\n這裡除了臭豆腐也有賣很多炸物！\n這次是吃臭豆腐，我超喜欸\n外皮酥脆，豆腐比較紮實多汁\n泡菜巨多，吃起來超級爽！\n內用座位比較少，可外帶到旁邊公園吃\n\n-\n\n📍1895乙未保台紀念公園\n🚗桃園市平鎮區復旦路二段66號\n\n這個地方大家應該都不陌生\n清水模橋早晚有不同風情的美\n但你們知道他底下是有展覽和互動遊戲的嗎\n展間設計蠻文青\n互動遊戲可以邊玩邊認識歷史\n我去過樓下才知道為何那邊有那麼多竹林意象！\n旁邊也有遊戲區，是蠻可愛的小公園😍😍\n\n-\n\n📍川耗仔\n🚗桃園市平鎮區延平路二段77號\n⏰週五～週三｜11:30-14:30；17:00-22:00\n\n愛吃辣的朋友不能錯過\n有很多口味的魚可以選\n適合多人聚餐的晚餐場所\n（中午吃感覺太辣會烙賽🥹）\n\n/\n\n以上！\n打完好累請按愛心打賞\n\n#桃園 #桃園景點 #桃園散步 #散步 #腳踏車 #平鎮 #平鎮景點 #平鎮必吃 #桃園必吃 #桃園美食 #桃園咖啡廳 #桃園甜點 #臭豆腐 #1895 #乙未保台紀念公園 #伯公潭橋 #youbike #桃園一日遊 #公園 #一日遊 #早午餐 #桃園早午餐 #平鎮早午餐 #桃園美食 #taoyuan #taoyuantravel #taoyuancity #taoyuanfood #foodporn #foodies #foodielife","username":"","tags":[],"cities":["桃園市"],"shortcode":"C2yePylvJ4X","address_city":"桃園市","other_cities":["桃園市"]},{"id":557,"url":"https://www.instagram.com/reel/C0WSAg0JU2M/","type":"Reel","city":"高雄市","category":"美食","caption":"今天早起出發去林園看看有什麼好吃的吧\n\n#美食#美食推薦#美食日記#高雄美食#高雄美食地圖#林園美食","username":"","tags":[],"cities":["高雄市"],"shortcode":"C0WSAg0JU2M"},{"id":558,"url":"https://www.instagram.com/reel/C2plW3oPIZ5/","type":"Reel","city":"桃園市","category":"美食","caption":"桃園📍Taoyuan\n｜一山景觀咖啡 ｜ @oneokmount.coffee \n🍱 特餐/彩椒雞丁\n☕️ 冰拿鐵\n·\n·\n一山景觀咖啡是位於桃園復興鄉的私房觀景秘境\n咖啡廳前映入眼簾的是石門水庫上游的湖水景觀\n遼闊綿延的山巒，坐擁了270度的湖光山色，美得猶如一幅山水畫\n在這用餐下午茶，感受大自然的靜謐美好，有遠離喧囂之感覺\n雖說園區不大，但觀景視野極佳，能眺望絕美的山水風光\n呼吸著山中清新的空氣，在戶外喝個下午茶、曬曬熱情的太陽，超舒服～\n咖啡廳提供簡單的咖啡、茶飲、牛奶特調、特餐、蛋糕甜食，品項並不算多，不過應有盡有，特餐是老闆現點現做的家常料理\n非常推薦朋友們玩復興鄉時，能順遊踩點唷\n\n-\n🏚 桃園市復興區三鄰丸山21之5號\n🕰 10:00-18:00（週二三四公休）\n☎️ 0905 772 892\n📌 入館用餐每人低消一杯飲料， 笑死)\n\nBrave- 勇 350元\n以威士忌高原騎士12年為基底，搭配向日葵瓜子與蒲公英混合而成的糖漿，這就是所謂的勇氣糖漿。\n這杯對我來說就是甜甜的厚酒我也覺得 喝起來蠻順口的沒有烈酒那種辣感。\n\n尼羅河 350元\n\n後記\n有時候酒吧覺得稍微有點太安靜了必須要一直對話接話題，對於當認識的朋友來說不免有些尷尬，這種新型態的酒吧出現，對於剛約會不久的男女來說可能會更適合一點。\n重點也沒有舞池，不像夜店會讓人感覺搭訕的型態很強烈還要應付一些想要搭訕的人。\n適合三五好友，坐在沙發座放鬆 CHill一個晚上。\n\n※店家優惠資訊※\n\n①每週二、三、日\n「Happy Hour 」\n20:00-23:00\n⚡️百威啤酒暢飲 $499/人\n\n②每週二｜微醺Day\n⚡️紅酒、白酒、香檳氣泡酒（全品項買二送一）\n加贈經典烤物or炸物一份\n\n③每週三｜Lady’s night\n⚡️女生整晚調酒半價\n⚡️女生三人以上同行贈烤物一份\n\n④每週四｜暢飲爛醉Day\n⚡️23:00前入場\n百威啤酒、金賓high ball整晚暢飲只要$699/人\n\n⑤每週五｜狂歡之夜\n⚡️野格蹦蹦全場半價\n⚡️22:00前入場贈指定調酒X1\n\n⑥每週六｜Party night\n⚡️四人以上贈試管酒一組\n⚡️五款野格調酒半價\n⚡️八人以上贈香檳、紅酒各一\n\n⑦每週日｜Gentleman day\n⚡️洋酒開瓶全品項二贈一並享九折優惠\n⚡️凡洋酒開瓶即贈食物任選）\n\n⚪︎———————————⚪︎\n🏠：SWAP Kaohsiung\n☎️：07 9766030\n🚃：高雄市新興區文化路52號\n⏰：2000–0300\n休：無店休\n💰：人均約500-2000元\n\n※ 營業時間和菜單價格可能會發生變化。\n 請提前查看店家網站或電話詢問。\n⚪︎———————————⚪︎\n\n#高雄酒吧 #高雄美食 #高雄美食地圖 #高雄部落客 #高雄酒吧地圖 #高雄酒吧推薦 #高雄夜店 #高雄夜生活 #高雄酒店 #高雄dj #dj表演 #高雄酒吧dj表演 #高雄夜店DJ #kaohsiungbar #高雄bar #高雄喝酒 #高雄新興 #新堀江 #新堀江商圈 #新堀江酒吧 #高雄餐酒館 #swap_kaohsiung #高雄夜店推薦","username":"","tags":[],"cities":["高雄市"],"shortcode":"Cw6_CO5h3m3","address_city":"高雄市","other_cities":["高雄市"]},{"id":568,"url":"https://www.instagram.com/reel/CyniWAWvzds/","type":"Reel","city":"高雄市","category":"住宿","caption":"Tag要來高雄玩的朋友🔥\n不敢相信！只要450元就能入住高雄市超美熱帶南洋風民宿🌴\n除了美美的民宿，一樓是很有質感的酒吧，餐點和調酒也都很推！酒還可以帶到房間喝哦🍹\n一定要收藏起來！！\n📍南喃至嶼nan nan B&B\n🍸酒吧：20:00-02:30\n高雄市新興區南華路101號\n#高雄美食 #高雄住宿 #高雄酒吧 #高雄餐酒館 #高雄 #kaohsiung #taiwan #南喃至嶼","username":"","tags":[],"cities":["高雄市"],"shortcode":"CyniWAWvzds","address_city":"高雄市","other_cities":["高雄市"]},{"id":569,"url":"https://www.instagram.com/reel/Cz_hpXOv01T/","type":"Reel","city":"高雄市","category":"美食","caption":"鼓山區河川街17號\n” #阿妙麵店 “\n\n在地人必買宵夜麵店\n古早味老店、評論破千則👍\n推薦乾麵、麻醬麵、滷味小菜\n醬料區有辣油、蒜泥必須加\n內用還有冷氣可以吹，出餐快翻桌率也很快\n-\n麻醬麵：小$40、大$50\n貢丸湯：$30\n———————————\n營業時間：17點～凌晨1點\n（公休日不一定，會提早張貼）\n電話：07-553 6636\n—————————\n#高雄#高雄美食#高雄美食地圖 #高雄宵夜 #高雄必吃 #高雄麵店 #高雄麻醬麵 #麻醬麵 #宵夜#鼓山美食 #鼓山區美食 #高雄小吃#高雄平價美食 #高雄傳統小吃 #高雄傳統美食 #Kaohsiung #高雄銅板小吃 #高雄銅板美食  #高雄在地小吃 #高雄在地美食 #taiwantra   const list=filtered();
  $('#stats').textContent=`${city}｜${cat==='全部'?'':cat+'｜'}顯示 ${list.length} 筆`;
  $$('.city-btn').forEach(b=>{const c=b.dataset.city; const n=c==='全部'?items().length:items().filter(x=>(Array.isArray(x.cities)?x.cities:[x.city]).includes(c)).length; const el=b.querySelector('b');if(el)el.textContent=n; b.classList.toggle('active',c===city);});
  $('#cards').innerHTML=list.length?list.map(x=>{const id=String(x.id),v=visited.has(id),w=wish.has(id),im=image(x);return `<article class="card"><div class="card-img">${im?`<img loading="lazy" src="${esc(im)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="img-fallback" style="display:${im?'none':'flex'}">${x.category==='美食'?'🍜':x.category==='住宿'?'🏨':'📍'}</div><span class="badge">${esc(x.category||'其他')}</span></div><div class="card-top"><span class="type">${esc(x.type||'')}</span></div><h3>${esc(title(x))}</h3><p>${esc(x.caption||x.note||'沒有貼文文字')}</p><div class="actions"><button class="visited ${v?'on':''}" data-visit="${id}">${v?'✓ 已去過':'❤️ 去過'}</button><button class="${w?'on':''}" data-wish="${id}">${w?'★ 已收藏':'☆ 想去'}</button><button class="edit-btn" data-edit="${id}">✏️ 編輯</button>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">開 IG ↗</a>`:''}</div></article>`}).join(''):'<div class="empty">目前沒有符合條件的收藏。<br>可以換個縣市或分類看看。</div>';
 }
 
function cityList(x){
  if(Array.isArray(x.cities) && x.cities.length) return x.cities;
  return x.city && x.city!=='待整理' ? [x.city] : [];
}
function branchList(x){
  if(Array.isArray(x.branches)) return x.branches;
  return [];
}
function renderBranches(branches){
  const box=$('#editBranches'); if(!box)return;
  box.innerHTML='';
  (branches||[]).forEach(b=>addBranchRow(b.city||'',b.district||''));
}
function addBranchRow(cityName='', district=''){
  const box=$('#editBranches'); if(!box)return;
  const row=document.createElement('div'); row.className='branch-row';
  row.innerHTML=`<select>${cities.map(c=>`<option value="${esc(c)}" ${c===cityName?'selected':''}>${esc(c)}</option>`).join('')}</select><input placeholder="區域，例如：鳳山區" value="${esc(district)}"><button type="button" class="danger" onclick="this.parentElement.remove()">刪除</button>`;
  box.appendChild(row);
}
function openEditor(id){
  const x=items().find(z=>String(z.id)===String(id)); if(!x)return;
  $('#editId').value=id;
  $('#editName').value=x.name||title(x);
  $('#editCategory').value=x.category||'其他';
  $('#editAddress').value=x.address||'';
  $('#editImage').value=x.image||'';
  $('#editNote').value=x.note||'';
  $('#editUrl').value=x.url||'';
  const selected=cityList(x);
  $$('#editCityChecks input').forEach(cb=>cb.checked=selected.includes(cb.value));
  renderBranches(branchList(x));
  $('#editor').classList.add('show');
}
function closeEditor(){$('#editor').classList.remove('show');}
$$('.city-btn').forEach(b=>b.addEventListener('click',()=>{city=b.dataset.city;cat='全部';type='全部';$('#category').value='全部';$('#type').value='全部';render();}));
$('#category').addEventListener('change',e=>{cat=e.target.value;render()});
$('#type').addEventListener('change',e=>{type=e.target.value;render()});
$('#search').addEventListener('input',e=>{q=e.target.value;render()});
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-visit]');
  if(v){const id=v.dataset.visit;visited.has(id)?visited.delete(id):visited.add(id);persist();render();return}
  const w=e.target.closest('[data-wish]');
  if(w){const id=w.dataset.wish;wish.has(id)?wish.delete(id):wish.add(id);persist();render();return}
  const ed=e.target.closest('[data-edit]');
  if(ed){openEditor(ed.dataset.edit);return}
  if(e.target.id==='editorCancel')closeEditor();
});
$('#newPlace').addEventListener('click',()=>{
  const n={id:'new-'+Date.now(),url:'',type:'自建',city:'台北市',cities:['台北市'],branches:[],category:'美食',caption:'',username:'',tags:[]};
  custom.push(n);persist();openEditor(n.id);
});
$('#addBranch').addEventListener('click',()=>addBranchRow('',''));
$('#editorForm').addEventListener('submit',e=>{
  e.preventDefault();
  const id=$('#editId').value;
  const selected=[...document.querySelectorAll('#editCityChecks input:checked')].map(x=>x.value);
  const branches=[...document.querySelectorAll('#editBranches .branch-row')].map(r=>({city:r.children[0].value,district:r.children[1].value.trim()})).filter(x=>x.city||x.district);
  edits[id]={...(edits[id]||{}),name:$('#editName').value.trim(),cities:selected,city:selected[0]||'待整理',branches,category:$('#editCategory').value,address:$('#editAddress').value.trim(),image:$('#editImage').value.trim(),note:$('#editNote').value.trim(),url:$('#editUrl').value.trim()};
  persist();closeEditor();render();
});
$('#deletePlace').addEventListener('click',()=>{
  const id=$('#editId').value;
  if(custom.some(x=>String(x.id)===String(id))){
    custom=custom.filter(x=>String(x.id)!==String(id)); delete edits[id]; persist(); closeEditor(); render();
  }else if(confirm('這筆是原始 IG 收藏，要在網站隱藏它嗎？')){
    edits[id]={...(edits[id]||{}),hidden:true}; persist(); closeEditor(); render();
  }
});
})();
</script><div class="v6-badge">網站版本 V6</div></body></html>
